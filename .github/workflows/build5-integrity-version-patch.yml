name: Build 5 Integrity Version Patch

on:
  push:
    branches:
      - feature/build-5-version-10
    paths:
      - .build5v10/patch-integrity-version

permissions:
  contents: write

concurrency:
  group: build5-integrity-version-patch
  cancel-in-progress: false

jobs:
  patch-one-line:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/build-5-version-10
          fetch-depth: 0

      - name: Replace exactly one stale certification literal
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/integrity_test.py')
          source = path.read_text()
          old = "package.get('version') == '9.0.0'"
          new = "package.get('version') == '10.0.0'"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale version literal, found {count}.')
          path.write_text(source.replace(old, new, 1))

      - name: Prove only the intended line changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- tests/integrity_test.py | awk '{print $1+$2}')" = "2"
          git diff -- tests/integrity_test.py
          ! git diff --name-only | grep -Ev '^tests/integrity_test.py$'

      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 5 Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/integrity_test.py
          git commit -m 'test: certify Version 10 package metadata'
          git push origin HEAD:feature/build-5-version-10
