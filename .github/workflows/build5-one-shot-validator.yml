name: Almost Human Build 5 Source Export

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: almost-human-build5-source-export
  cancel-in-progress: false

jobs:
  export-source:
    if: github.head_ref == 'feature/build-5-version-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/build-5-version-10

      - name: Package recovered source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/almost-human-build5-recovered-source.zip . -x '.git/*'
          sha256sum /tmp/almost-human-build5-recovered-source.zip | tee BUILD5_RECOVERED_SOURCE.sha256

      - name: Upload recovered source once
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-build5-recovered-source
          path: |
            /tmp/almost-human-build5-recovered-source.zip
            BUILD5_RECOVERED_SOURCE.sha256
          retention-days: 7
          if-no-files-found: error
