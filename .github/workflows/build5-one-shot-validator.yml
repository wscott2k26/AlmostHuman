name: Almost Human Build 5 One-Shot Validator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: almost-human-build5-one-shot
  cancel-in-progress: false

jobs:
  validate-and-record:
    if: github.head_ref == 'feature/build-5-version-10'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/build-5-version-10

      - name: Analyze staged archive
        shell: bash
        run: |
          set -u
          cat \
            .build5/patch.part-00 \
            .build5/patch.part-01 \
            .build5/patch.part-02 \
            .build5/patch.part-03 \
            .build5/patch.part-04 \
            .build5/patch.part-05 \
            .build5/patch.part-06 \
            .build5/patch.part-07 > /tmp/build5.b64
          base64 --decode /tmp/build5.b64 > /tmp/build5-truncated.zip
          echo "TRUNCATED_SHA=$(sha256sum /tmp/build5-truncated.zip | awk '{print $1}')"
          for part in 06 07 08; do
            echo "PART_${part}_LENGTH=$(wc -c < .build5/patch.part-${part})"
            echo "PART_${part}_MOD4=$(( $(wc -c < .build5/patch.part-${part}) % 4 ))"
            printf 'PART_%s_HEAD=' "$part"; head -c 48 .build5/patch.part-${part}; echo
            printf 'PART_%s_TAIL=' "$part"; tail -c 48 .build5/patch.part-${part}; echo
          done
          python3 - <<'PY'
          from pathlib import Path
          p7=Path('.build5/patch.part-07').read_text()
          p8=Path('.build5/patch.part-08').read_text()
          best=0
          for k in range(1, min(len(p7),len(p8))+1):
              if p7[-k:]==p8[:k]: best=k
          print(f'P7_P8_MAX_OVERLAP={best}')
          print(f'P8_IN_P7={p8 in p7}')
          print(f'P7_IN_P8={p7 in p8}')
          PY
          rm -f /tmp/build5-recovered.zip
          yes | zip -FF /tmp/build5-truncated.zip --out /tmp/build5-recovered.zip || true
          if [ -f /tmp/build5-recovered.zip ]; then
            echo "RECOVERED_SHA=$(sha256sum /tmp/build5-recovered.zip | awk '{print $1}')"
            unzip -t /tmp/build5-recovered.zip || true
            echo "RECOVERED_FILE_COUNT=$(zipinfo -1 /tmp/build5-recovered.zip 2>/dev/null | wc -l)"
            zipinfo -1 /tmp/build5-recovered.zip 2>/dev/null | tail -n 20 || true
          else
            echo "RECOVERED_ZIP_MISSING=yes"
          fi
          exit 1
