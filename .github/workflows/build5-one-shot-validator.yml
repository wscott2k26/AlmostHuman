name: Almost Human Build 5 One-Shot Validator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: almost-human-build5-one-shot
  cancel-in-progress: false

jobs:
  validate-and-record:
    if: github.head_ref == 'feature/build-5-version-10'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/build-5-version-10

      - name: Analyze encoded tail alignments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile

          parts=[Path(f'.build5/patch.part-{i:02d}').read_text().strip() for i in range(9)]
          prefix=''.join(parts[:8])
          a=base64.b64decode(prefix, validate=True)
          print('PREFIX_BYTES', len(a), 'SHA', __import__('hashlib').sha256(a).hexdigest())
          tail=parts[8]
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          for n in range(4):
              s=('A'*n)+tail
              s += '='*((-len(s))%4)
              try:
                  b=base64.b64decode(s, validate=True)
              except Exception as e:
                  print('ALIGN',n,'DECODE_ERROR',repr(e)); continue
              pk03=b.count(b'PK\x03\x04'); pk01=b.count(b'PK\x01\x02'); pk05=b.count(b'PK\x05\x06')
              print('ALIGN',n,'BYTES',len(b),'PK03',pk03,'PK01',pk01,'PK05',pk05,'HEAD',b[:16].hex(),'TAIL',b[-32:].hex())
              best=0
              maxk=min(len(a),len(b),20000)
              for k in range(maxk,0,-1):
                  if a[-k:]==b[:k]:
                      best=k; break
              print('ALIGN',n,'OVERLAP',best)
              combo=a+b[best:]
              try:
                  z=zipfile.ZipFile(io.BytesIO(combo))
                  bad=z.testzip()
                  print('ALIGN',n,'ZIP_OPEN=yes','FILES',len(z.namelist()),'BAD',bad)
                  print('ALIGN',n,'LAST_FILES',z.namelist()[-12:])
              except Exception as e:
                  print('ALIGN',n,'ZIP_OPEN=no',repr(e))
          PY
          exit 1
