name: Almost Human Build 5 Transfer Fingerprint

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  fingerprint:
    if: github.head_ref == 'feature/build-5-version-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/build-5-version-10

      - name: Verify each transfer block
        shell: bash
        run: |
          set -u
          expected_lengths=(7000 7000 10000 10000 15000 15000 15000 15000 15000 15000 10380)
          expected_hashes=(
            cbc13909b17fbd8866e31c8b85436adeaecff81af0ff31515c85666dc0d16ea9
            91fb9188b60a782a55ce25fa9ffe9f78f246ececa9284bb3a406579b39c2ed12
            882ed50bce092507f703d5de9802cd9654fe00ebd4244c5c7abc5e4604529bbd
            5ea303abe5b4b4a4a6818cd5698829df4f96b692777e7dd3255bdc3cc0ab5bee
            add8ad0644717789cd65807f3e4ca25cda9a624f5b14fd16778056f3408dfb35
            40027de11d07235f2ec9e9bbe2f126d5d3bed09cf71bc7958a49a0159788ca0e
            b806e7c4f5fe77e64da358cbd89e2891cbd873851c031987b73a1f069dd85918
            d09050f6376ea2986809b49f6a3b178cf8268cc1ef359682d971e93137b1361f
            e78a1ca65c690082666c6a0eb4bc777eee3a43421b12f21dec6709fd159e2949
            14eacebfedfcb597c040f4bafd3a546f2b9fe21c098e1394fbb2f09911132bd0
            6fa2841de92b387539a44898e1c8addb4e5766b1cdd8cee704e59e7c1448e0c9
          )
          failed=0
          for i in $(seq -w 0 10); do
            file=".build5v10/part-${i}"
            index=$((10#$i))
            if [ ! -f "$file" ]; then
              echo "PART_${i}=MISSING"
              failed=1
              continue
            fi
            length=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            invalid=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$file" | wc -c | tr -d ' ')
            echo "PART_${i} length=${length}/${expected_lengths[$index]} sha=${hash}/${expected_hashes[$index]} invalid=${invalid}"
            if [ "$length" != "${expected_lengths[$index]}" ] || [ "$hash" != "${expected_hashes[$index]}" ] || [ "$invalid" != "0" ]; then
              failed=1
            fi
          done
          cat .build5v10/part-* > /tmp/build5-v10.b64
          echo "TOTAL_LENGTH=$(wc -c < /tmp/build5-v10.b64 | tr -d ' ')"
          if base64 --decode /tmp/build5-v10.b64 > /tmp/build5-v10.tar.gz; then
            echo "BASE64_DECODE=pass"
            echo "ARCHIVE_SHA=$(sha256sum /tmp/build5-v10.tar.gz | awk '{print $1}')"
          else
            echo "BASE64_DECODE=fail"
            failed=1
          fi
          exit "$failed"
