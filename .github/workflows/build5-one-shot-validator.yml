name: Almost Human Build 5 One-Shot Validator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: almost-human-build5-one-shot
  cancel-in-progress: false

jobs:
  validate-and-record:
    if: github.head_ref == 'feature/build-5-version-10'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/build-5-version-10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Diagnose staged archive tails
        shell: bash
        run: |
          set -u
          for tail in 07 08; do
            cat \
              .build5/patch.part-00 \
              .build5/patch.part-01 \
              .build5/patch.part-02 \
              .build5/patch.part-03 \
              .build5/patch.part-04 \
              .build5/patch.part-05 \
              .build5/patch.part-06 \
              ".build5/patch.part-${tail}" > "/tmp/build5-${tail}.b64"
            if base64 --decode "/tmp/build5-${tail}.b64" > "/tmp/build5-${tail}.zip"; then
              echo "TAIL_${tail}_SHA256=$(sha256sum "/tmp/build5-${tail}.zip" | awk '{print $1}')"
              if unzip -t "/tmp/build5-${tail}.zip"; then
                echo "TAIL_${tail}_VALID_ZIP=yes"
              else
                echo "TAIL_${tail}_VALID_ZIP=no"
              fi
            else
              echo "TAIL_${tail}_BASE64_VALID=no"
            fi
          done
          exit 1
