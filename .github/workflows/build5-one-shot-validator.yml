name: Almost Human Build 5 Candidate Validator

on:
  push:
    branches:
      - feature/build-5-version-10
    paths:
      - .build5v10/READY

permissions:
  contents: write

concurrency:
  group: almost-human-build5-candidate
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/build-5-version-10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Reassemble and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .build5v10/part-* > /tmp/build5-v10.b64
          base64 --decode /tmp/build5-v10.b64 > /tmp/build5-v10.tar.gz
          echo "c1400fef9cdbe7d7c055adce3a1ef09db5915bca8c35ad33c0841f36840e9f7c  /tmp/build5-v10.tar.gz" | sha256sum --check
          tar -tzf /tmp/build5-v10.tar.gz >/tmp/build5-v10-files.txt
          tar -xzf /tmp/build5-v10.tar.gz -C .
          rm -f .build5v10/part-*

      - name: Install and synchronize source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/build-inline.mjs

      - name: Freeze source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Almost Human Build Validator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Almost Human Build 5 Version 10"
          echo "BUILD5_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run four complete web backend security passes
        run: npm run test:quadruple

      - name: Install native dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate native project
        working-directory: mobile
        run: |
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple

      - name: Export iOS locally without cloud build
        working-directory: mobile
        run: npm run export:ios

      - name: Export Android locally without cloud build
        working-directory: mobile
        run: npm run export:android

      - name: Record review and export evidence
        shell: bash
        run: |
          set -euo pipefail
          hash_dir() {
            find "$1" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          IOS_HASH="$(hash_dir mobile/dist-ios)"
          ANDROID_HASH="$(hash_dir mobile/dist-android)"
          export IOS_HASH ANDROID_HASH
          node <<'NODE'
          const fs = require('node:fs');
          const generatedAt = new Date().toISOString();
          const receipt = {
            product: 'Almost Human',
            release: 'Build 5 / Version 10.0',
            source_sha: process.env.BUILD5_SOURCE_SHA,
            generated_at: generatedAt,
            validation: {
              web_backend_security_passes: 4,
              native_preflight_passes: 4,
              expo_doctor: 'pass',
              native_typecheck: 'pass',
              native_lint: 'pass',
            },
            exports: {
              ios_directory_sha256: process.env.IOS_HASH,
              android_directory_sha256: process.env.ANDROID_HASH,
            },
            release_counters: {
              eas_builds: 0,
              testflight_uploads: 0,
              app_store_releases: 0,
            },
          };
          fs.writeFileSync('mobile/BUILD5_EXPORTS.json', `${JSON.stringify(receipt, null, 2)}\n`);
          fs.writeFileSync('BUILD5_CODE_REVIEW.md', `# Almost Human Build 5 Code Review\n\nSource SHA: ${process.env.BUILD5_SOURCE_SHA}\nGenerated: ${generatedAt}\n\n## Corrections made before certification\n\n- Rebuilt the Version 10 app integration shell from the certified Version 9 foundation after rejecting a corrupted handoff archive.\n- Implemented real Identity Studio category undo instead of a no-op.\n- Corrected Identity Studio neural preview to use the Version 10 voice profile.\n- Replaced unsupported CSS multiplication in particle placement with deterministic positions.\n- Removed a duplicate native bridge type declaration.\n- Ensured meaningful haptics honor tactile-feedback and reduced-motion preferences.\n- Corrected rollback result handling so a missing snapshot cannot report success.\n\n## Verified boundaries\n\n- Existing companion identity and history are preserved.\n- Database changes are additive.\n- Device speech is explicit only after neural failure.\n- No EAS build, TestFlight upload, App Store release, or automatic production merge occurred.\n\n## Result\n\nFour complete web/backend/security passes, Expo Doctor, native TypeScript, native lint, four native preflights, and both local exports passed from the frozen source SHA.\n`);
          NODE

      - name: Upload zero-credit export evidence
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-build5-zero-credit-exports
          path: |
            mobile/dist-ios
            mobile/dist-android
            mobile/BUILD5_EXPORTS.json
            mobile/BUILD5_QUADRUPLE_PREFLIGHT.md
            BUILD5_CODE_REVIEW.md
          retention-days: 14
          if-no-files-found: error

      - name: Commit receipts and push isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add mobile/BUILD5_EXPORTS.json mobile/BUILD5_QUADRUPLE_PREFLIGHT.md BUILD5_CODE_REVIEW.md
          git commit -m "test: certify Build 5 zero-credit candidate"
          git push origin HEAD:feature/build-5-version-10
