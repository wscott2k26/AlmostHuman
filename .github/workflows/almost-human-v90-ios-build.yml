name: Almost Human 9.0 Protected iOS Build

on:
  push:
    branches: [main]
    paths:
      - '.github/run-v90-ios-build.json'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: almost-human-v90-ios-build
  cancel-in-progress: false

env:
  MOBILE_DIR: mobile
  EXPECTED_OWNER: wscott2k8
  EXPECTED_BUNDLE_ID: com.stormandme.almosthuman
  EXPECTED_EAS_PROJECT_ID: cd0be7bb-e65a-454e-b255-3b261de060ee
  EXPECTED_RELEASE_CHANNEL: haven-9.0-conversation-first
  EXPECTED_PRIOR_BUILD_ID: 61c38061-c2e0-43f5-b8a2-43b0af8cd187
  EXPECTED_PRIOR_BUILD_NUMBER: '3'
  EXPECTED_NEW_BUILD_NUMBER: '4'
  CERTIFIED_MERGE_COMMIT: 3015a1572e2708646ac87ca4fc16655b2941097f
  WEB_BUILD_HASH: 07db3f766057641e56682919f4b05bb1c16b080e766e05c79fab09a31928a87e

jobs:
  certify-and-build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out canonical main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact one-build authorization and zero-submission boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const trigger = require('./.github/run-v90-ios-build.json');
          const expected = {
            operation: 'BUILD_V90_ONCE',
            confirm: 'BUILD_V90_ONCE',
            expectedOwner: process.env.EXPECTED_OWNER,
            expectedBundleId: process.env.EXPECTED_BUNDLE_ID,
            expectedEasProjectId: process.env.EXPECTED_EAS_PROJECT_ID,
            expectedReleaseChannel: process.env.EXPECTED_RELEASE_CHANNEL,
            expectedPriorBuildId: process.env.EXPECTED_PRIOR_BUILD_ID,
            expectedPriorBuildNumber: process.env.EXPECTED_PRIOR_BUILD_NUMBER,
            certifiedMergeCommit: process.env.CERTIFIED_MERGE_COMMIT,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (String(trigger[key] ?? '') !== String(value)) {
              throw new Error(`${key} mismatch`);
            }
          }
          if (trigger.attempt !== 1) throw new Error('Only attempt 1 is authorized');
          if (trigger.easBuildCreditsAuthorized !== 1) throw new Error('Exactly one EAS build credit must be authorized');
          if (trigger.easSubmissionsAuthorized !== 0) throw new Error('TestFlight submissions are not authorized');
          const workflow = fs.readFileSync('.github/workflows/almost-human-v90-ios-build.yml', 'utf8').toLowerCase();
          if (/\beas\s+submit\b/.test(workflow) || /\baltool\b/.test(workflow) || /\bnotarytool\b/.test(workflow)) {
            throw new Error('A submission or notarization command exists in the build-only lane');
          }
          console.log('Exactly one Almost Human 9.0 iOS build is authorized; submissions remain zero.');
          NODE

      - name: Preserve finished builds 2 and 3 and refuse a duplicate 9.0 build
        shell: bash
        run: |
          set -euo pipefail
          test -f STEP7_IOS_BUILD_RECORD.json
          test -f STEP8_IOS_BUILD_RECORD.json
          test ! -f STEP9_IOS_BUILD_RECORD.json
          node - <<'NODE'
          const build2 = require('./STEP7_IOS_BUILD_RECORD.json');
          const build3 = require('./STEP8_IOS_BUILD_RECORD.json');
          if (build2.status !== 'FINISHED' || String(build2.appBuildVersion) !== '2') {
            throw new Error('Original build 2 receipt is not intact');
          }
          if (build3.status !== 'FINISHED' || String(build3.appBuildVersion) !== process.env.EXPECTED_PRIOR_BUILD_NUMBER) {
            throw new Error('Preserved build 3 receipt is not intact');
          }
          if (build3.buildId !== process.env.EXPECTED_PRIOR_BUILD_ID) {
            throw new Error('Preserved build 3 ID mismatch');
          }
          if (Number(build3.testFlightSubmissionsRun || 0) !== 0) {
            throw new Error('Unexpected TestFlight submission recorded for build 3');
          }
          NODE

      - name: Require exact certified 9.0 application source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CERTIFIED_MERGE_COMMIT^{commit}"
          git diff --quiet "$CERTIFIED_MERGE_COMMIT" HEAD -- \
            app mobile supabase scripts tests package.json package-lock.json tsconfig.edge.json vercel.json
          test -f ALMOST_HUMAN_9_CERTIFICATION.md
          test -f ALMOST_HUMAN_9_RELEASE_CANDIDATE.json
          test -f ALMOST_HUMAN_9_WEB_DEPLOYMENT.json
          test -f RELEASE_STATUS.md
          node - <<'NODE'
          const candidate = require('./ALMOST_HUMAN_9_RELEASE_CANDIDATE.json');
          const deployment = require('./ALMOST_HUMAN_9_WEB_DEPLOYMENT.json');
          const app = require('./mobile/app.json').expo || {};
          if (candidate.status !== 'WEB_BACKEND_RELEASE_CANDIDATE_CERTIFIED') throw new Error('9.0 candidate is not certified');
          if (candidate.version !== '9.0.0') throw new Error('Wrong certified release version');
          if (candidate.readyForOnePaidIosBuildAuthorization !== true) throw new Error('Candidate is not authorized for one signed build');
          if (Number(candidate.easBuildsRun) !== 0 || Number(candidate.testFlightUploadsRun) !== 0) throw new Error('9.0 release counters are not at zero');
          if (candidate.tests?.webBackendSecurityPasses !== 4 || candidate.tests?.mobilePreflightPasses !== 4) throw new Error('Required four-pass certification is missing');
          if (candidate.tests?.finalLiveVerification !== 'PASSED') throw new Error('Final live verification is missing');
          if (deployment.status !== 'READY' || deployment.version !== '9.0.0') throw new Error('Production web deployment receipt is not ready');
          if (deployment.contentHash !== process.env.WEB_BUILD_HASH) throw new Error('Production web hash mismatch');
          if (app.owner !== process.env.EXPECTED_OWNER) throw new Error('Expo owner mismatch');
          if (app.ios?.bundleIdentifier !== process.env.EXPECTED_BUNDLE_ID) throw new Error('iOS bundle mismatch');
          if (app.android?.package !== process.env.EXPECTED_BUNDLE_ID) throw new Error('Android package mismatch');
          if (app.extra?.eas?.projectId !== process.env.EXPECTED_EAS_PROJECT_ID) throw new Error('EAS project mismatch');
          if (app.extra?.releaseChannel !== process.env.EXPECTED_RELEASE_CHANNEL) throw new Error('Wrong 9.0 release channel');
          NODE
          ! grep -R --line-number -E 'Your voice feels warm|Your voice came back|sound feels safe and familiar' \
            app/core/stages.js supabase/functions/_shared/developmentalStages.ts

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify protected Expo account
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          ACCOUNT="$(eas whoami | tr -d '\r' | head -n 1 | awk '{print $1}')"
          echo "Expo account: $ACCOUNT"
          test "$ACCOUNT" = "$EXPECTED_OWNER"

      - name: Re-run complete web backend and security gate four times
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:quadruple
          node -e "const b=require('./dist/build-meta.json'); if(b.version!=='9.0.0')throw Error('Wrong built web version'); if(b.contentHash!==process.env.WEB_BUILD_HASH)throw Error('Built web hash does not match certified production');"

      - name: Rebuild the exact offline native bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-inline.mjs
          git diff --quiet -- mobile/assets/almost-human.html

      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Re-run all mobile gates and no-credit exports
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo install --check
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android

      - name: Verify canonical EAS project without relinking
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas project:info --non-interactive | tee ../v90-eas-project-info.txt
          node -e "const a=require('./app.json').expo||{}; if(a.owner!==process.env.EXPECTED_OWNER)throw Error('Wrong Expo owner'); if(a.ios?.bundleIdentifier!==process.env.EXPECTED_BUNDLE_ID)throw Error('Wrong iOS bundle'); if(a.extra?.eas?.projectId!==process.env.EXPECTED_EAS_PROJECT_ID)throw Error('Wrong EAS project');"
          git diff --quiet -- app.json eas.json package-lock.json assets/almost-human.html

      - name: Confirm build 3 is still the latest EAS iOS version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build:list --platform ios --limit 50 --json --non-interactive > ../v90-ios-before.json
          node - <<'NODE'
          const raw = require('../v90-ios-before.json');
          const builds = Array.isArray(raw) ? raw : (raw.builds || []);
          if (!Array.isArray(builds) || !builds.length) throw new Error('EAS returned no iOS build inventory');
          const prior = builds.find((build) => build.id === process.env.EXPECTED_PRIOR_BUILD_ID);
          if (!prior) throw new Error('Preserved build 3 is missing from EAS inventory');
          if (String(prior.appBuildVersion) !== process.env.EXPECTED_PRIOR_BUILD_NUMBER) throw new Error('Preserved build 3 version mismatch in EAS');
          if (String(prior.status || '').toLowerCase() !== 'finished') throw new Error('Preserved build 3 is not finished in EAS');
          const unexpected = builds.filter((build) => Number(build.appBuildVersion) > Number(process.env.EXPECTED_PRIOR_BUILD_NUMBER));
          if (unexpected.length) {
            throw new Error('A newer iOS build already exists; refusing to spend another credit: ' + unexpected.map((build) => `${build.id}:${build.appBuildVersion}:${build.status}`).join(', '));
          }
          console.log('Build 3 is still the latest EAS iOS version.');
          NODE

      - name: Spend exactly one production iOS build credit
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --wait --json > ../v90-ios-build.json
          node -e "const x=require('../v90-ios-build.json'); console.log(JSON.stringify(x,null,2));"

      - name: Record the successful 9.0 build without submitting it
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const raw = require('./v90-ios-build.json');
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build?.id) throw new Error('EAS returned no build ID');
          if (String(build.status || '').toLowerCase() !== 'finished') throw new Error('Build status is not finished: ' + build.status);
          if (String(build.appBuildVersion) !== process.env.EXPECTED_NEW_BUILD_NUMBER) {
            throw new Error(`Expected build ${process.env.EXPECTED_NEW_BUILD_NUMBER}; received ${build.appBuildVersion}`);
          }
          const sourceCommit = cp.execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();
          const record = {
            status: build.status,
            product: 'Almost Human',
            releaseVersion: '9.0.0',
            buildId: build.id,
            platform: build.platform || 'IOS',
            appVersion: build.appVersion || '1.0.0',
            appBuildVersion: String(build.appBuildVersion),
            artifacts: build.artifacts || null,
            buildDetailsPageUrl: build.buildDetailsPageUrl || null,
            createdAt: build.createdAt || new Date().toISOString(),
            githubRunId: process.env.GITHUB_RUN_ID,
            sourceCommit,
            certifiedMergeCommit: process.env.CERTIFIED_MERGE_COMMIT,
            priorBuildId: process.env.EXPECTED_PRIOR_BUILD_ID,
            priorBuildNumber: process.env.EXPECTED_PRIOR_BUILD_NUMBER,
            easBuildCreditsUsedForThisRelease: 1,
            testFlightSubmissionsRun: 0,
          };
          fs.writeFileSync('STEP9_IOS_BUILD_RECORD.json', JSON.stringify(record, null, 2) + '\n');

          const candidate = require('./ALMOST_HUMAN_9_RELEASE_CANDIDATE.json');
          candidate.tests = { ...(candidate.tests || {}), signedIosBuild: true };
          candidate.signedIosBuild = {
            status: record.status,
            buildId: record.buildId,
            appBuildVersion: record.appBuildVersion,
            createdAt: record.createdAt,
            sourceCommit: record.sourceCommit,
            certifiedMergeCommit: record.certifiedMergeCommit,
            testFlightSubmissionsRun: 0,
          };
          candidate.readyForOnePaidIosBuildAuthorization = false;
          candidate.easBuildsRun = 1;
          candidate.testFlightUploadsRun = 0;
          candidate.knownLimitations = (candidate.knownLimitations || []).filter((item) => !String(item).includes('requires a future signed iOS build'));
          fs.writeFileSync('ALMOST_HUMAN_9_RELEASE_CANDIDATE.json', JSON.stringify(candidate, null, 2) + '\n');

          fs.writeFileSync('RELEASE_STATUS.md', `# Almost Human 9.0 release status\n\n## Complete\n\n- Conversation-first 9.0 interface with true streamed text, anti-repetition protection, and canned vocal-praise guards.\n- Secure OpenAI neural voice and transcription. The six-profile ElevenLabs abstraction remains optional.\n- Production Supabase chat, voice, transcription, health, privacy, and database security updates.\n- Production web deployment \`dpl_JCVTgEzyXbar4SnFegsBxTcfX3Gp\` at \`https://almost-human-swart.vercel.app\`.\n- Four complete web, backend, and security certification passes.\n- Expo Doctor, TypeScript, lint, four native preflight passes, iOS no-credit export, and Android no-credit export.\n- Signed Almost Human 9.0 iOS build ${record.appBuildVersion}: \`${record.buildId}\`.\n- Existing user data and prior signed builds 2 and 3 preserved.\n\n## Measured production performance\n\n- Median first streamed text: **1,104 ms**\n- P95 first streamed text: **2,159 ms**\n- Median complete text: **1,278 ms**\n- Median neural audio completion and first audio: **1,608 ms**\n- P95 neural audio completion and first audio: **2,032 ms**\n\n## Next controlled step\n\nThe signed 9.0 iOS build is complete. TestFlight submission requires separate explicit authorization and has not been run.\n\n## Credit boundary\n\n- EAS builds run for 9.0: **1**\n- TestFlight uploads run for 9.0: **0**\n`);
          NODE
          git config user.name 'Almost Human 9.0 Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add STEP9_IOS_BUILD_RECORD.json ALMOST_HUMAN_9_RELEASE_CANDIDATE.json RELEASE_STATUS.md
          git commit -m 'Record successful Almost Human 9.0 iOS build'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Save signed-build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-v90-ios-records
          path: |
            v90-ios-before.json
            v90-ios-build.json
            v90-eas-project-info.txt
            mobile/STEP7_PREFLIGHT.json
            mobile/STEP7_QUADRUPLE_PREFLIGHT.md
            STEP9_IOS_BUILD_RECORD.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report exact blocker without retrying
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Almost Human 9.0 iOS build needs attention — run $GITHUB_RUN_ID" \
            --body "The protected 9.0 build-only lane stopped. Do not rerun blindly. Review the exact failed step: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. TestFlight submissions remain unauthorized."
