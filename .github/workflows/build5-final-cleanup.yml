name: Build 5 Final Branch Cleanup

on:
  push:
    branches:
      - feature/build-5-version-10
    paths:
      - BUILD5_CLEANUP_NOW

permissions:
  contents: write

concurrency:
  group: build5-final-branch-cleanup
  cancel-in-progress: false

jobs:
  clean-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-5-version-10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Remove abandoned transfer and recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build5v10 recovery
          rm -f .github/workflows/build5-branch-checkpoint.yml
          rm -f .github/workflows/build5-integrity-sw-patch.yml
          rm -f .github/workflows/build5-final-cleanup.yml
          rm -f BUILD5_CLEANUP_NOW
          test -f BUILD5_ROLLBACK_BASELINE.md
          test -f BUILD5_SECURITY_REVIEW.md
          ! find . -path './.git' -prune -o -type f \( -name 'part-*' -o -name '*ARCHIVE_RECOVERY*' -o -name '*CENTRAL_DIRECTORY*' \) -print | grep .

      - name: Certify clean source tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck:edge
          npm test
          npm run test:integrity
          npm run build
          npm run test:browser
          git diff --check

      - name: Commit clean reviewed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 5 Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove abandoned Build 5 transfer recovery files'
          git push origin HEAD:feature/build-5-version-10
