name: Almost Human Step 7 iOS Build

on:
  push:
    branches: [main]
    paths:
      - '.github/run-ios-build.json'
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Type BUILD_ONCE to spend one iOS EAS build credit'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: almost-human-step7-ios
  cancel-in-progress: false

env:
  MOBILE_DIR: mobile
  EXPECTED_OWNER: wscott2k8
  EXPECTED_BUNDLE_ID: com.stormandme.almosthuman

jobs:
  certify-and-build-ios:
    if: ${{ github.event_name == 'push' || inputs.confirm_build == 'BUILD_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate explicit one-build authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CONFIRM: ${{ inputs.confirm_build }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            node -e "const t=require('./.github/run-ios-build.json'); if(t.operation!=='BUILD_ONCE')throw Error('Invalid build operation'); if(t.confirm!=='BUILD_ONCE')throw Error('Missing exact build confirmation'); if(t.expectedOwner!==process.env.EXPECTED_OWNER)throw Error('Build owner mismatch'); if(t.expectedBundleId!==process.env.EXPECTED_BUNDLE_ID)throw Error('Build bundle mismatch'); if(t.easBuildCreditsAuthorized!==1)throw Error('Exactly one build credit must be authorized'); if(t.easSubmissionsAuthorized!==0)throw Error('This lane cannot submit to TestFlight'); console.log('One-build authorization verified');"
          else
            test "$MANUAL_CONFIRM" = "BUILD_ONCE"
          fi

      - name: Refuse accidental duplicate successful build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f STEP7_IOS_BUILD_RECORD.json ]]; then
            echo 'A successful Step 7 iOS build record already exists. Submit that build instead of spending another credit.'
            cat STEP7_IOS_BUILD_RECORD.json
            exit 1
          fi

      - name: Require completed no-build preflight state
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test -f mobile/package-lock.json
          test -f FULL_AUDIT_RESULT.json
          test -f LIVE_SMOKE_RESULT.json
          node -e "const a=require('./mobile/app.json').expo||{}; const audit=require('./FULL_AUDIT_RESULT.json'); const live=require('./LIVE_SMOKE_RESULT.json'); if(audit.status!=='passed')throw Error('Full audit is not passed'); if(live.status!=='passed')throw Error('Live smoke is not passed'); if(a.owner!==process.env.EXPECTED_OWNER)throw Error('Wrong Expo owner'); if(a.ios?.bundleIdentifier!==process.env.EXPECTED_BUNDLE_ID)throw Error('Wrong iOS bundle'); if(a.android?.package!==process.env.EXPECTED_BUNDLE_ID)throw Error('Wrong Android package'); if(!a.extra?.eas?.projectId)throw Error('EAS project ID missing'); console.log('Certified EAS project '+a.extra.eas.projectId);"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify protected Expo token and account
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          ACCOUNT="$(eas whoami | tr -d '\r' | head -n 1 | awk '{print $1}')"
          echo "Expo account: $ACCOUNT"
          test "$ACCOUNT" = "$EXPECTED_OWNER"

      - name: Install locked web certification dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete web cloud and security gate four times
        shell: bash
        run: npm run test:quadruple

      - name: Rebuild exact offline native bundle
        shell: bash
        run: node scripts/build-inline.mjs

      - name: Install locked mobile dependencies
        working-directory: mobile
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Expo dependency alignment and mobile release gates
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo install --check
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android

      - name: Verify canonical EAS project without relinking
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas project:info --non-interactive | tee ../eas-project-info.txt
          node -e "const a=require('./app.json').expo||{}; if(a.owner!==process.env.EXPECTED_OWNER)throw Error('Wrong Expo owner'); if(a.ios?.bundleIdentifier!==process.env.EXPECTED_BUNDLE_ID)throw Error('Wrong iOS bundle'); if(a.android?.package!==process.env.EXPECTED_BUNDLE_ID)throw Error('Wrong Android package'); if(!a.extra?.eas?.projectId)throw Error('EAS project ID missing'); console.log('Verified EAS project '+a.extra.eas.projectId);"
          git diff --quiet -- app.json eas.json package-lock.json

      - name: Spend one production iOS build credit
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --wait --json > ../ios-build.json
          node -e "const x=require('../ios-build.json'); console.log(JSON.stringify(x,null,2));"

      - name: Record successful build without creating another
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),cp=require('child_process'); const raw=require('./ios-build.json'); const b=Array.isArray(raw)?raw[0]:raw; if(!b?.id)throw Error('EAS returned no build ID'); if(String(b.status||'').toLowerCase()!=='finished')throw Error('Build status is not finished: '+b.status); const r={status:b.status,buildId:b.id,platform:b.platform||'IOS',appVersion:b.appVersion||'1.0.0',appBuildVersion:b.appBuildVersion||null,artifacts:b.artifacts||null,buildDetailsPageUrl:b.buildDetailsPageUrl||null,createdAt:b.createdAt||new Date().toISOString(),githubRunId:process.env.GITHUB_RUN_ID,sourceCommit:cp.execSync('git rev-parse HEAD',{encoding:'utf8'}).trim()}; fs.writeFileSync('STEP7_IOS_BUILD_RECORD.json',JSON.stringify(r,null,2)+'\n');"
          git config user.name 'Almost Human Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add STEP7_IOS_BUILD_RECORD.json
          git commit -m 'Record successful Almost Human Step 7 iOS build'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Save release records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-step7-ios-records
          path: |
            ios-build.json
            eas-project-info.txt
            mobile/STEP7_PREFLIGHT.json
            mobile/STEP7_QUADRUPLE_PREFLIGHT.md
            STEP7_IOS_BUILD_RECORD.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report exact blocker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Almost Human Step 7 iOS build needs attention — run $GITHUB_RUN_ID" --body "The protected one-build workflow stopped before TestFlight submission. Review the exact failed step: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
