name: Certify Almost Human 9.0 Final Candidate

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-certification-v2.json'

permissions:
  contents: write

concurrency:
  group: certify-almost-human-9-final
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_REF: onvoaskzzxozmhkzyycy
      PRODUCTION_ORIGIN: https://almost-human-swart.vercel.app
      WEB_DEPLOYMENT_ID: dpl_JCVTgEzyXbar4SnFegsBxTcfX3Gp
      WEB_BUILD_HASH: 07db3f766057641e56682919f4b05bb1c16b080e766e05c79fab09a31928a87e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate exact zero-release authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          trigger=json.loads(Path('.github/run-ah9-certification-v2.json').read_text())
          assert trigger['operation']=='CERTIFY_AH9_FINAL_ONCE'
          assert trigger['webDeploymentId']=='dpl_JCVTgEzyXbar4SnFegsBxTcfX3Gp'
          assert trigger['easBuildsAuthorized']==0
          assert trigger['testFlightUploadsAuthorized']==0
          text=Path('.github/workflows/certify-ah9-release-v2.yml').read_text().lower()
          command_pattern=re.compile(r'(?im)^\s*(?:npx\s+)?'+'eas'+r'\s+(?:'+'build|submit'+r')\b')
          assert not command_pattern.search(text)
          assert ('al'+'tool') not in text
          assert ('notary'+'tool') not in text
          PY
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record production migrations and provider setup
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/202608010000_fix_privacy_delete_subscription_boundary.sql <<'SQL'
          create or replace function public.delete_my_almost_human_data(confirm_phrase text)
          returns boolean
          language plpgsql
          security invoker
          set search_path = public
          as $$
          declare uid uuid := auth.uid();
          begin
            if uid is null then
              raise exception 'Authentication required' using errcode = '42501';
            end if;
            if confirm_phrase <> 'DELETE MY ALMOST HUMAN DATA' then
              raise exception 'Confirmation phrase mismatch' using errcode = '22023';
            end if;
            delete from public.ai_entities where user_id = uid;
            delete from public.admin_events where user_id = uid;
            update public.profiles set onboarding_complete = false, updated_at = now() where id = uid;
            update public.app_settings set last_growth_check_at = null, last_export_at = null where user_id = uid;
            return true;
          end;
          $$;
          revoke all on function public.delete_my_almost_human_data(text) from public, anon;
          grant execute on function public.delete_my_almost_human_data(text) to authenticated;
          SQL

          cat > supabase/migrations/202608010001_harden_helper_function_boundaries.sql <<'SQL'
          alter function public.almost_human_stage(numeric) set search_path = public;
          alter function public.almost_human_stage_label(text) set search_path = public;
          revoke execute on function public.handle_new_user() from public, anon, authenticated;
          revoke execute on function public.is_admin() from public, anon;
          SQL

          mkdir -p docs
          cat > docs/ALMOST_HUMAN_9_PROVIDER_SETUP.md <<'MD'
          # Almost Human 9.0 provider setup

          ## Active production providers

          - Text conversation: OpenAI Responses streaming through JWT-protected `chat-stream`.
          - Neural voice: OpenAI neural speech through JWT-protected `voice-service`.
          - Transcription: OpenAI secure transcription through JWT-protected `transcription-service`.
          - Device system speech is not the normal path. It is available only as an explicit one-time fallback when neural audio fails.

          ## Required Supabase secrets

          Keep private provider values only in Supabase. Never place them in the web app, native bundle, repository, or Expo configuration.

          Active configuration:

          - `OPENAI_API_KEY`
          - Optional overrides: `OPENAI_FAST_CHAT_MODEL`, `OPENAI_CHAT_MODEL`, `OPENAI_TTS_MODEL`, `OPENAI_TRANSCRIBE_MODEL`
          - `ALLOWED_ORIGINS` containing production plus approved preview/local origins

          Optional ElevenLabs upgrade:

          - `ELEVENLABS_API_KEY`
          - `ELEVENLABS_VOICE_FEMALE_CHILD`
          - `ELEVENLABS_VOICE_FEMALE_TEEN`
          - `ELEVENLABS_VOICE_FEMALE_ADULT`
          - `ELEVENLABS_VOICE_MALE_CHILD`
          - `ELEVENLABS_VOICE_MALE_TEEN`
          - `ELEVENLABS_VOICE_MALE_ADULT`
          - Optional `ELEVENLABS_TTS_MODEL`

          ElevenLabs becomes active only when its API key and all six mappings exist. Otherwise OpenAI remains the secure neural provider.
          MD

      - name: Four complete web backend and security passes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:quadruple
          test "$(node -p "require('./dist/build-meta.json').contentHash")" = "$WEB_BUILD_HASH"
          ! grep -R --line-number -E 'Your voice feels warm|Your voice came back|sound feels safe and familiar' app/core/stages.js supabase/functions/_shared/developmentalStages.ts dist/core/stages.js

      - name: Complete mobile certification without cloud builds
        shell: bash
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple
          npm run export:ios
          npm run export:android

      - name: Verify production web backend neural voice and transcription
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.error, urllib.request
          from pathlib import Path

          config=Path('app/config.js').read_text()
          key=re.search(r"supabasePublishableKey:\s*'([^']+)'",config).group(1)
          base=f"https://{os.environ['PROJECT_REF']}.supabase.co"
          origin=os.environ['PRODUCTION_ORIGIN']

          def request(url, *, data=None, token=None, headers=None, timeout=60):
            merged={}
            if data is not None:
              merged['Content-Type']='application/json'
            if url.startswith(base):
              merged['apikey']=key
            if token:
              merged['Authorization']=f'Bearer {token}'
            if headers:
              merged.update(headers)
            body=None if data is None else json.dumps(data).encode()
            method='GET' if data is None else 'POST'
            return urllib.request.urlopen(urllib.request.Request(url,data=body,headers=merged,method=method),timeout=timeout)

          auth=json.loads(request(base+'/auth/v1/signup',data={'data':{'source':'ah9_final_certification_v2'}}).read())
          token=auth['access_token']
          deleted=False
          try:
            with request(base+'/functions/v1/health',headers={'Origin':origin}) as response:
              health=json.loads(response.read())
              health_cors=response.headers.get('Access-Control-Allow-Origin')
            assert health_cors==origin
            assert health.get('database') is True
            assert health.get('chat_stream_configured') is True
            assert health.get('neural_voice_configured') is True
            assert health.get('transcription_configured') is True

            for function_name in ('chat-stream','voice-service','transcription-service'):
              try:
                request(base+'/functions/v1/'+function_name,data={})
                raise AssertionError(function_name+' accepted a request without a user token')
              except urllib.error.HTTPError as error:
                assert error.code==401

            voice_started=time.monotonic()
            with request(base+'/functions/v1/voice-service',token=token,headers={'Origin':origin},data={
              'preview':True,
              'voice_id':'female-adult',
              'request_id':'ah9-final-certification-voice-v2',
            }) as response:
              audio=response.read()
              voice_ms=round((time.monotonic()-voice_started)*1000)
              voice_provider=response.headers.get('X-AH-Voice-Provider')
              voice_cors=response.headers.get('Access-Control-Allow-Origin')
              voice_type=(response.headers.get('Content-Type') or '').split(';')[0]
            assert len(audio)>1000
            assert voice_type.startswith('audio/')
            assert voice_provider in ('openai','elevenlabs')
            assert voice_cors==origin

            transcription_started=time.monotonic()
            with request(base+'/functions/v1/transcription-service',token=token,headers={'Origin':origin},data={
              'audio_base64':base64.b64encode(audio).decode(),
              'mime_type':voice_type,
              'language':'en',
            }) as response:
              transcription=json.loads(response.read())
              transcription_ms=round((time.monotonic()-transcription_started)*1000)
              transcription_cors=response.headers.get('Access-Control-Allow-Origin')
            payload=transcription.get('data') or transcription
            transcript_text=str(payload.get('text') or '').strip()
            assert transcript_text
            assert transcription_cors==origin

            with request(origin+'/') as response:
              index=response.read().decode()
            with request(origin+'/core/stages.js?v=9.0') as response:
              stages=response.read().decode()
            with request(origin+'/build-meta.json') as response:
              remote_build=json.loads(response.read())
            local_build=json.loads(Path('dist/build-meta.json').read_text())
            assert 'styles.css?v=9.0' in index
            assert 'app.js?v=9.0' in index
            assert 'Your voice feels warm' not in stages
            assert remote_build['version']=='9.0.0'
            assert remote_build['contentHash']==local_build['contentHash']==os.environ['WEB_BUILD_HASH']

            with request(base+'/functions/v1/privacy-service',token=token,data={
              'action':'delete_account',
              'confirm_phrase':'DELETE MY ACCOUNT',
            }) as response:
              deleted=json.loads(response.read()).get('status')=='account_deleted'
            assert deleted

            Path('/tmp/ah9-final-live-v2.json').write_text(json.dumps({
              'health':health,
              'cors':{
                'productionOrigin':origin,
                'health':health_cors,
                'voice':voice_cors,
                'transcription':transcription_cors,
              },
              'voice':{
                'provider':voice_provider,
                'completeMs':voice_ms,
                'audioBytes':len(audio),
                'contentType':voice_type,
              },
              'transcription':{
                'completeMs':transcription_ms,
                'mode':payload.get('mode') or transcription.get('mode'),
                'nonEmpty':True,
              },
              'web':{
                'deploymentId':os.environ['WEB_DEPLOYMENT_ID'],
                'url':origin,
                'version':remote_build['version'],
                'contentHash':remote_build['contentHash'],
              },
              'privacy':{
                'ephemeralAccountDeleted':deleted,
                'storedTranscriptText':False,
                'storedAudio':False,
              },
            },indent=2)+'\n')
          finally:
            if not deleted:
              try:
                request(base+'/functions/v1/privacy-service',token=token,data={'action':'delete_account','confirm_phrase':'DELETE MY ACCOUNT'}).read()
              except Exception:
                pass
          PY

      - name: Create sanitized certification and release records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def tree_hash(root):
            root=Path(root)
            digest=hashlib.sha256()
            for path in sorted(item for item in root.rglob('*') if item.is_file()):
              digest.update(path.relative_to(root).as_posix().encode()+b'\0')
              digest.update(hashlib.sha256(path.read_bytes()).digest())
            return digest.hexdigest()

          performance=json.loads(Path('ALMOST_HUMAN_9_PERFORMANCE.json').read_text())
          smoke=json.loads(Path('ALMOST_HUMAN_9_LIVE_SMOKE.json').read_text())
          live=json.loads(Path('/tmp/ah9-final-live-v2.json').read_text())
          web_build=json.loads(Path('dist/build-meta.json').read_text())
          limitations=[
            'ElevenLabs is not configured; OpenAI is the active secure neural voice provider.',
            'Neural speech is returned as a complete MP3, so measured first-audio timing equals completed-audio timing.',
            'Real-device validation of the 9.0 native shell requires a future signed iOS build; TestFlight build 3 remains untouched.',
            'Supabase leaked-password protection remains a dashboard configuration item.',
            'The authenticated SECURITY DEFINER is_admin helper remains executable because ownership RLS policies call it.',
            'Anonymous Supabase sessions intentionally use ownership-scoped authenticated-role RLS and therefore appear in the advisor anonymous-access warning group.',
          ]
          candidate={
            'status':'WEB_BACKEND_RELEASE_CANDIDATE_CERTIFIED',
            'product':'Almost Human',
            'version':'9.0.0',
            'verifiedSourceCommit':os.environ['VERIFIED_SOURCE_COMMIT'],
            'web':live['web'],
            'backend':{
              'projectRef':os.environ['PROJECT_REF'],
              'functions':{'health':6,'voice-service':9,'chat-stream':1,'transcription-service':1},
              'neuralVoiceProvider':live['voice']['provider'],
              'transcriptionMode':live['transcription']['mode'],
            },
            'tests':{
              'webBackendSecurityPasses':4,
              'mobilePreflightPasses':4,
              'mobileDoctor':True,
              'mobileTypecheck':True,
              'mobileLint':True,
              'iosNoCreditExport':True,
              'androidNoCreditExport':True,
              'liveSmoke':smoke['status'],
              'performanceHarness':performance['status'],
              'finalLiveVerification':'PASSED',
            },
            'performance':{
              'textTurns':performance['counts']['textTurns'],
              'voiceTurns':performance['counts']['voiceTurns'],
              'medianFirstDeltaMs':performance['text']['medianFirstDeltaMs'],
              'p95FirstDeltaMs':performance['text']['p95FirstDeltaMs'],
              'medianFinalTextMs':performance['text']['medianDoneMs'],
              'p95FinalTextMs':performance['text']['p95DoneMs'],
              'medianFirstAudioMs':performance['voice']['medianCompleteMs'],
              'p95FirstAudioMs':performance['voice']['p95CompleteMs'],
              'finalTranscriptionMs':live['transcription']['completeMs'],
              'interruption':'Source and behavior tests passed; real-device timing awaits a signed build.',
            },
            'cors':performance['cors'],
            'hashes':{
              'webDist':tree_hash('dist'),
              'iosExport':tree_hash('mobile/dist-ios'),
              'androidExport':tree_hash('mobile/dist-android'),
              'nativeHtml':hashlib.sha256(Path('mobile/assets/almost-human.html').read_bytes()).hexdigest(),
            },
            'knownLimitations':limitations,
            'readyForOnePaidIosBuildAuthorization':True,
            'easBuildsRun':0,
            'testFlightUploadsRun':0,
          }
          Path('ALMOST_HUMAN_9_RELEASE_CANDIDATE.json').write_text(json.dumps(candidate,indent=2)+'\n')
          Path('ALMOST_HUMAN_9_WEB_DEPLOYMENT.json').write_text(json.dumps({
            'status':'READY',
            'deploymentId':os.environ['WEB_DEPLOYMENT_ID'],
            'target':'production',
            'url':os.environ['PRODUCTION_ORIGIN'],
            'version':'9.0.0',
            'contentHash':web_build['contentHash'],
            'sourceCommit':os.environ['VERIFIED_SOURCE_COMMIT'],
          },indent=2)+'\n')

          certification=['# Almost Human 9.0 certification','','## Certified scope','',
            f"Almost Human 9.0 web, backend, database migrations, streamed conversation, neural voice, secure transcription, migration preservation, and the Expo native source/export pipeline are certified from `{os.environ['VERIFIED_SOURCE_COMMIT']}`.",'',
            '## Verification evidence','',
            '- Four complete web/backend/security passes completed from one source revision.',
            '- Expo Doctor, TypeScript, lint, four native preflights, iOS export, and Android export completed without EAS.',
            f"- Production deployment `{os.environ['WEB_DEPLOYMENT_ID']}` is READY at `{os.environ['PRODUCTION_ORIGIN']}`.",
            f"- Production content hash `{web_build['contentHash']}` matches the locally certified build.",
            f"- Twenty text turns: median first delta {performance['text']['medianFirstDeltaMs']} ms; p95 {performance['text']['p95FirstDeltaMs']} ms; median final text {performance['text']['medianDoneMs']} ms.",
            f"- Ten neural voice turns: median completed/first audio {performance['voice']['medianCompleteMs']} ms; p95 {performance['voice']['p95CompleteMs']} ms.",
            f"- Secure transcription completed in {live['transcription']['completeMs']} ms with a non-empty result; transcript text and audio were not stored in receipts.",
            '- Exact production-origin CORS, JWT rejection, request-id replay, account deletion, and no canned vocal-praise fallback passed.','',
            '## Provider state','',
            'OpenAI is the active text, neural voice, and transcription provider. ElevenLabs remains an explicit optional configuration and is not silently replaced by device speech.','',
            '## Native boundary','',
            'Native 9.0 source and offline exports are certified, but real-device behavior cannot be claimed until a future signed iOS build. Existing TestFlight build 3 remains unchanged. A paid iOS build and a TestFlight upload each require separate explicit authorization.','',
            '## Known limitations','']
          certification.extend('- '+item for item in limitations)
          certification.extend(['','## Release boundary','','- EAS builds run: **0**','- TestFlight uploads run: **0**','- Ready to request authorization for one paid iOS build: **yes**',''])
          Path('ALMOST_HUMAN_9_CERTIFICATION.md').write_text('\n'.join(certification))

          status=['# Almost Human 9.0 release status','','## Complete','',
            '- Conversation-first 9.0 interface, true streamed text, anti-repetition and vocal-praise guards.',
            '- Secure OpenAI neural voice and transcription; the six-profile ElevenLabs abstraction remains optional.',
            '- Production Supabase services and database privacy/security migrations.',
            f"- Production web deployment `{os.environ['WEB_DEPLOYMENT_ID']}` at `{os.environ['PRODUCTION_ORIGIN']}`.",
            '- Four-pass source certification, four-pass mobile preflight, iOS/Android no-credit exports, live smoke, and measured performance evidence.',
            '- Existing user data and TestFlight build 3 preserved.','',
            '## Next controlled step','',
            'Source, web, and backend are ready. One new signed iOS build requires fresh explicit authorization. TestFlight submission remains a separate later authorization.','',
            '## Credit boundary','','- EAS builds run for 9.0: **0**','- TestFlight uploads run for 9.0: **0**','']
          Path('RELEASE_STATUS.md').write_text('\n'.join(status))
          PY

      - name: Commit certification records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human 9.0 Certification'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_9_CERTIFICATION.md ALMOST_HUMAN_9_RELEASE_CANDIDATE.json ALMOST_HUMAN_9_WEB_DEPLOYMENT.json RELEASE_STATUS.md docs/ALMOST_HUMAN_9_PROVIDER_SETUP.md supabase/migrations/202608010000_fix_privacy_delete_subscription_boundary.sql supabase/migrations/202608010001_harden_helper_function_boundaries.sql
          git commit -m 'docs: certify Almost Human 9.0 release candidate'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
