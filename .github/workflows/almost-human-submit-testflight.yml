name: Submit Existing Almost Human Build to TestFlight

on:
  push:
    branches: [main]
    paths:
      - '.github/run-testflight-submit.json'
  workflow_dispatch:
    inputs:
      asc_app_id:
        description: 'Numeric App Store Connect Apple ID for Almost Human'
        required: true
        type: string
      confirm_submit:
        description: 'Type SUBMIT_EXISTING (this does not create a new build)'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: almost-human-testflight-submit
  cancel-in-progress: false

env:
  EXPECTED_OWNER: wscott2k8
  EXPECTED_BUNDLE_ID: com.stormandme.almosthuman

jobs:
  submit-existing-build:
    if: ${{ github.event_name == 'push' || inputs.confirm_submit == 'SUBMIT_EXISTING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate explicit existing-build submission authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ASC_APP_ID: ${{ inputs.asc_app_id }}
          MANUAL_CONFIRM: ${{ inputs.confirm_submit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            node - <<'NODE'
            const fs = require('fs');
            const trigger = JSON.parse(fs.readFileSync('.github/run-testflight-submit.json', 'utf8'));
            if (trigger.operation !== 'SUBMIT_EXISTING') throw new Error('Invalid submission operation.');
            if (trigger.confirm !== 'SUBMIT_EXISTING') throw new Error('Missing exact submission confirmation.');
            if (trigger.expectedOwner !== process.env.EXPECTED_OWNER) throw new Error('Submission owner mismatch.');
            if (trigger.expectedBundleId !== process.env.EXPECTED_BUNDLE_ID) throw new Error('Submission bundle mismatch.');
            if (!/^\d{8,15}$/.test(String(trigger.ascAppId || ''))) throw new Error('Invalid App Store Connect app ID.');
            if (trigger.easBuildCreditsAuthorized !== 0) throw new Error('Submission lane authorizes zero new builds.');
            if (trigger.easSubmissionsAuthorized !== 1) throw new Error('Exactly one existing-build submission must be authorized.');
            fs.appendFileSync(process.env.GITHUB_ENV, `ASC_APP_ID=${trigger.ascAppId}\n`);
            NODE
          else
            test "$MANUAL_CONFIRM" = "SUBMIT_EXISTING"
            [[ "$MANUAL_ASC_APP_ID" =~ ^[0-9]{8,15}$ ]]
            echo "ASC_APP_ID=$MANUAL_ASC_APP_ID" >> "$GITHUB_ENV"
          fi

      - name: Confirm the exact successful iOS build exists
        shell: bash
        run: |
          set -euo pipefail
          test -f STEP7_IOS_BUILD_RECORD.json || { echo 'No successful build record exists.'; exit 1; }
          node - <<'NODE'
          const r = require('./STEP7_IOS_BUILD_RECORD.json');
          if (!r.buildId) throw new Error('No EAS iOS build ID recorded');
          if (String(r.status || '').toLowerCase() !== 'finished') throw new Error(`Recorded build is not finished: ${r.status}`);
          if (String(r.platform || '').toUpperCase() !== 'IOS') throw new Error(`Recorded build is not iOS: ${r.platform}`);
          console.log(`Exact recorded build: ${r.buildId}`);
          NODE
          test -f mobile/package-lock.json || { echo 'Mobile dependency lock is missing.'; exit 1; }

      - name: Verify static app identity
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const app = require('./app.json');
          const expo = app.expo || {};
          if (expo.owner !== process.env.EXPECTED_OWNER) throw new Error(`Wrong Expo owner: ${expo.owner}`);
          if (expo.ios?.bundleIdentifier !== process.env.EXPECTED_BUNDLE_ID) throw new Error(`Wrong iOS bundle: ${expo.ios?.bundleIdentifier}`);
          if (!expo.extra?.eas?.projectId) throw new Error('EAS project ID is missing');
          console.log(`Identity verified for project ${expo.extra.eas.projectId}`);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify protected Expo token and account
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN repository secret is missing.'; exit 1; }
          ACCOUNT="$(eas whoami | tr -d '\r' | head -n 1 | awk '{print $1}')"
          echo "Expo account: $ACCOUNT"
          test "$ACCOUNT" = "$EXPECTED_OWNER"

      - name: Install locked mobile dependencies
        working-directory: mobile
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record App Store Connect identity
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(file, 'utf8'));
          eas.submit ||= {};
          eas.submit.production ||= {};
          eas.submit.production.ios ||= {};
          eas.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
          fs.writeFileSync(file, JSON.stringify(eas, null, 2) + '\n');
          NODE
          git diff -- eas.json

      - name: Preserve App Store Connect identity on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add mobile/eas.json
          if git diff --cached --quiet; then
            echo 'App Store Connect identity already recorded.'
          else
            git commit -m 'Record Almost Human App Store Connect identity'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Submit only the exact recorded build to TestFlight
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(node -e "process.stdout.write(require('../STEP7_IOS_BUILD_RECORD.json').buildId)")"
          test -n "$BUILD_ID"
          echo "Submitting exact EAS build ID: $BUILD_ID"
          eas submit \
            --platform ios \
            --profile production \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait 2>&1 | tee ../testflight-submit.log

      - name: Save submission record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-testflight-submission
          path: testflight-submit.log
          if-no-files-found: warn
          retention-days: 90

      - name: Report exact submission blocker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Almost Human TestFlight submission needs attention — run $GITHUB_RUN_ID" \
            --body "No new build was created. The exact recorded iOS build submission stopped here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
