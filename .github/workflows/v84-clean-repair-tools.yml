name: Almost Human 8.4 Clean Repair Tools

on:
  push:
    branches:
      - repair/native-experience-8-4
    paths:
      - '.github/run-v84-clean-repair-tools.json'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/native-experience-8-4
          fetch-depth: 0
      - name: Verify certification exists
        run: |
          test -f V84_NATIVE_EXPERIENCE_CERTIFICATION.md
          grep -q 'passed four consecutive times' V84_NATIVE_EXPERIENCE_CERTIFICATION.md
      - name: Remove one-time repair tooling only
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/run-v84-native-repair.json \
            .github/workflows/almost-human-v84-native-repair.yml \
            .github/workflows/v84-pr-apply-and-certify.yml \
            .github/workflows/v84-pr-diagnostic.yml \
            scripts/repair_v84_gate_followup.py \
            scripts/repair_v84_native_experience.py \
            .github/workflows/v84-clean-repair-tools.yml \
            .github/run-v84-clean-repair-tools.json
          git config user.name 'Almost Human Cleanup'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git commit -m 'Remove completed one-time repair tooling'
          git pull --rebase --autostash origin repair/native-experience-8-4
          git push origin HEAD:repair/native-experience-8-4
