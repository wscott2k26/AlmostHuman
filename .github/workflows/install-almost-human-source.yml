name: Install Almost Human 8.3 Source

on:
  push:
    branches:
      - main
    paths:
      - 'Almost-Human-8.3-Haven-TestFlight-Source*.zip'
      - .github/workflows/install-almost-human-source.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: almost-human-source-install
  cancel-in-progress: false

jobs:
  install-certified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate and verify exact certified package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='bb72d70bdc66d270c04a315a4092aeff27d04927b227cdc04f74221fa62c6225'
          mapfile -t CANDIDATES < <(find . -maxdepth 1 -type f -name 'Almost-Human-8.3-Haven-TestFlight-Source*.zip' -printf '%f\n' | sort)
          (( ${#CANDIDATES[@]} > 0 )) || {
            echo 'Upload the certified Almost Human 8.3 ZIP at the repository root, then run this workflow again.'
            exit 1
          }
          PACKAGE=''
          for CANDIDATE in "${CANDIDATES[@]}"; do
            ACTUAL="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
            if [[ "$ACTUAL" == "$EXPECTED" ]]; then
              PACKAGE="$CANDIDATE"
              break
            fi
          done
          test -n "$PACKAGE" || {
            echo 'No uploaded ZIP matched the certified SHA-256.'
            sha256sum "${CANDIDATES[@]}"
            exit 1
          }
          unzip -t "$PACKAGE"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Extract and verify every packaged source file
        shell: bash
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          rm -rf /tmp/almost-human-source
          mkdir -p /tmp/almost-human-source
          unzip -q "$PACKAGE" -d /tmp/almost-human-source
          SOURCE='/tmp/almost-human-source/AlmostHuman'
          test -f "$SOURCE/SOURCE_MANIFEST.sha256"
          test -f "$SOURCE/mobile/app.json"
          test -f "$SOURCE/mobile/eas.json"
          test -f "$SOURCE/mobile/src/NativeShell.tsx"
          test -f "$SOURCE/.github/workflows/almost-human-step7-ios.yml"
          (
            cd "$SOURCE"
            sha256sum -c SOURCE_MANIFEST.sha256
          )

      - name: Publish normal certified source to main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='/tmp/almost-human-source/AlmostHuman'
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE"/. ./
          git config user.name 'Almost Human Source Installer'
          git config user.email 'loftlatte25@gmail.com'
          git add -A
          git commit -m 'Publish certified Almost Human 8.3 Haven source'
          git push origin HEAD:main

      - name: Report exact installer blocker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Almost Human source installer needs attention — run $GITHUB_RUN_ID" \
            --body "The checksum-verified source installer stopped here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
