name: Deploy Almost Human 9.0 Live Services

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-live-services.json'

permissions:
  contents: write

concurrency:
  group: deploy-almost-human-9-live-services
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: onvoaskzzxozmhkzyycy
      EXPECTED_SOURCE_COMMIT: a442a23fb1826a826ba3461a18101fa76ed96a4f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0

      - name: Validate exact deployment authorization and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('.github/run-ah9-live-services.json').read_text())
          assert trigger['operation']=='DEPLOY_EXACT_AH9_SERVICES_ONCE'
          assert trigger['sourceCommit']=='a442a23fb1826a826ba3461a18101fa76ed96a4f'
          assert trigger['projectRef']=='onvoaskzzxozmhkzyycy'
          assert trigger['functions']==['chat-stream','voice-service','health']
          assert trigger['easBuildsAuthorized']==0
          assert trigger['testFlightUploadsAuthorized']==0
          PY
          git diff --quiet "$EXPECTED_SOURCE_COMMIT" HEAD -- app supabase mobile package.json package-lock.json tests scripts
          test -f supabase/functions/chat-stream/index.ts
          test -f supabase/functions/voice-service/index.ts
          test -f supabase/functions/health/index.ts
          ! grep -R --line-number -E 'eas[[:space:]]+(build|submit)|altool|notarytool' .github/workflows/deploy-ah9-live-services.yml

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy exact Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy chat-stream --project-ref "$PROJECT_ID"
          supabase functions deploy voice-service --project-ref "$PROJECT_ID"
          supabase functions deploy health --project-ref "$PROJECT_ID"

      - name: Verify live health and JWT boundary
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_KEY=$(python3 - <<'PY'
          import re
          text=open('app/config.js').read()
          match=re.search(r"supabasePublishableKey:\s*'([^']+)'", text)
          assert match
          print(match.group(1))
          PY
          )
          BASE="https://${PROJECT_ID}.supabase.co/functions/v1"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error -H "apikey: $PUBLIC_KEY" "$BASE/health" > /tmp/health.json; then break; fi
            sleep 5
          done
          jq -e '.ok == true and .chat_stream_configured == true and .neural_voice_configured == true' /tmp/health.json >/dev/null
          CHAT_STATUS=$(curl --silent --output /tmp/chat-unauthorized.json --write-out '%{http_code}' -H "apikey: $PUBLIC_KEY" -H 'Content-Type: application/json' --data '{}' "$BASE/chat-stream")
          VOICE_STATUS=$(curl --silent --output /tmp/voice-unauthorized.json --write-out '%{http_code}' -H "apikey: $PUBLIC_KEY" -H 'Content-Type: application/json' --data '{}' "$BASE/voice-service")
          test "$CHAT_STATUS" = 401
          test "$VOICE_STATUS" = 401
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text())
          receipt={
            'status':'DEPLOYED_AND_SMOKE_CHECKED',
            'projectRef':os.environ['PROJECT_ID'],
            'sourceCommit':os.environ['EXPECTED_SOURCE_COMMIT'],
            'functions':['chat-stream','voice-service','health'],
            'health':{
              'database':health.get('database'),
              'aiConfigured':health.get('ai_configured'),
              'chatStreamConfigured':health.get('chat_stream_configured'),
              'neuralVoiceConfigured':health.get('neural_voice_configured'),
              'neuralVoiceProvider':health.get('neural_voice_provider'),
              'elevenLabsConfigured':health.get('elevenlabs_configured'),
              'transcriptionConfigured':health.get('transcription_configured'),
            },
            'jwtBoundary':{'chatStreamWithoutUserToken':401,'voiceServiceWithoutUserToken':401},
            'easBuildsRun':0,
            'testFlightUploadsRun':0,
          }
          Path('ALMOST_HUMAN_9_SUPABASE_DEPLOYMENT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Save receipt and remove one-time deploy lane
        shell: bash
        run: |
          set -euo pipefail
          rm .github/run-ah9-live-services.json
          rm .github/workflows/deploy-ah9-live-services.yml
          git config user.name 'Almost Human 9.0 Release'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add -A
          git commit -m 'ops: record Almost Human 9.0 Supabase deployment'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
