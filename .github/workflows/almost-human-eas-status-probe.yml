name: Almost Human Read-Only EAS Status Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/run-eas-status-probe.json'

permissions:
  contents: write
  issues: write

jobs:
  status-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up EAS read-only client
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Read current iOS build state
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(eas whoami | tr -d '\r' | head -n 1 | awk '{print $1}')"
          test "$ACCOUNT" = "wscott2k8"
          eas build:list --platform ios --limit 5 --json --non-interactive > /tmp/eas-ios-builds.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/eas-ios-builds.json', 'utf8'));
          const builds = rows.map((b) => ({
            id: b.id || null,
            status: b.status || null,
            platform: b.platform || null,
            createdAt: b.createdAt || null,
            updatedAt: b.updatedAt || null,
            completedAt: b.completedAt || null,
            appVersion: b.appVersion || null,
            appBuildVersion: b.appBuildVersion || null,
            gitCommitHash: b.gitCommitHash || null,
            distribution: b.distribution || null,
            artifactUrlPresent: Boolean(b.artifacts?.buildUrl || b.artifactUrl),
            errorCode: b.error?.errorCode || b.error?.code || null,
            errorMessage: b.error?.message || null
          }));
          const result = {
            status: 'passed',
            operation: 'READ_ONLY_EAS_IOS_STATUS',
            generatedAt: new Date().toISOString(),
            expoOwner: 'wscott2k8',
            buildCommandsRun: 0,
            submitCommandsRun: 0,
            builds
          };
          fs.writeFileSync('../EAS_IOS_STATUS_RESULT.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Save status receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add EAS_IOS_STATUS_RESULT.json
          if git diff --cached --quiet; then
            echo 'No status change to record.'
            exit 0
          fi
          git commit -m 'Record current Almost Human EAS iOS status'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Report status probe failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Almost Human read-only EAS status probe failed — run $GITHUB_RUN_ID" --body "No build or submission command was authorized. Review the read-only status probe: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
