name: Almost Human 8.4 Repair Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile repair scripts
        run: |
          python3 -m py_compile scripts/repair_v84_native_experience.py
          python3 -m py_compile scripts/repair_v84_gate_followup.py
      - name: Apply repair in disposable workspace
        run: |
          python3 scripts/repair_v84_native_experience.py
          python3 scripts/repair_v84_gate_followup.py
      - name: Parse JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/core/store.js
          node --check app/core/engine.js
          node --check app/core/cloud.js
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool mobile/package.json >/dev/null
          python3 -m json.tool mobile/app.json >/dev/null
      - name: Confirm requested UX markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "requestRecordingPermissionsAsync" mobile/src/NativeShell.tsx
          grep -q "Speech.speak" mobile/src/NativeShell.tsx
          grep -q "female-child" app/app.js
          grep -q "male-adult" app/app.js
          grep -q "customize-companion" app/app.js
          grep -q "transcription-service" app/config.js
          grep -q "One tap. No streak. No judgment." app/app.js
          grep -q "simple, never meaningless" app/app.js
          ! grep -q "typing-dots" app/app.js
          ! grep -q "THOUGHT_PHASES" app/app.js
