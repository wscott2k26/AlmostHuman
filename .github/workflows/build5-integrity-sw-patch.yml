name: Build 5 Integrity Service Worker Patch

on:
  push:
    branches:
      - feature/build-5-version-10
    paths:
      - .build5v10/patch-integrity-sw

permissions:
  contents: write

concurrency:
  group: build5-integrity-sw-patch
  cancel-in-progress: false

jobs:
  patch-one-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-5-version-10
          fetch-depth: 0

      - name: Replace exactly one stale service-worker expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/integrity_test.py')
          source = path.read_text()
          old = "check('service worker version advanced', 'almost-human-v9-0-conversation' in sw and 'v=9.0' in sw)"
          new = "check('service worker version advanced', 'almost-human-v10-0-evolution-shell' in sw and 'v=10.0' in sw and 'version10.js?v=10.0' in sw)"
          if source.count(old) != 1:
              raise SystemExit(f'Expected one stale service-worker check, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1))

      - name: Verify one-line change and full integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- tests/integrity_test.py | awk '{print $1+$2}')" = "2"
          ! git diff --name-only | grep -Ev '^tests/integrity_test.py$'
          python3 tests/integrity_test.py
          node --test tests/build5_offline10.test.mjs

      - name: Commit guarded maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 5 Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/integrity_test.py
          git commit -m 'test: certify Version 10 offline cache metadata'
          git push origin HEAD:feature/build-5-version-10
