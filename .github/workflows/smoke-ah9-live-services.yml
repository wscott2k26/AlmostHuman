name: Smoke Test Almost Human 9.0 Live Services

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-live-smoke.json'

permissions:
  contents: write

concurrency:
  group: smoke-almost-human-9-live-services
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: onvoaskzzxozmhkzyycy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0

      - name: Validate zero-release smoke authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('.github/run-ah9-live-smoke.json').read_text())
          assert trigger['operation']=='RUN_EPHEMERAL_AH9_LIVE_SMOKE_ONCE'
          assert trigger['projectRef']=='onvoaskzzxozmhkzyycy'
          assert trigger['easBuildsAuthorized']==0
          assert trigger['testFlightUploadsAuthorized']==0
          text=Path('.github/workflows/smoke-ah9-live-services.yml').read_text().lower()
          forbidden=['eas '+'build','eas '+'submit','al'+'tool','notary'+'tool']
          assert not any(value in text for value in forbidden)
          PY

      - name: Run ephemeral authenticated streaming and neural voice smoke
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(python3 - <<'PY'
          import re
          text=open('app/config.js').read()
          match=re.search(r"supabasePublishableKey:\s*'([^']+)'", text)
          assert match
          print(match.group(1))
          PY
          )
          BASE="https://${PROJECT_REF}.supabase.co"
          AUTH=$(curl --fail --silent --show-error \
            -H "apikey: $KEY" -H 'Content-Type: application/json' \
            --data '{"data":{"source":"almost_human_9_ephemeral_smoke"}}' \
            "$BASE/auth/v1/signup")
          ACCESS=$(jq -r '.access_token // empty' <<<"$AUTH")
          USER_ID=$(jq -r '.user.id // empty' <<<"$AUTH")
          test -n "$ACCESS"
          test -n "$USER_ID"
          export KEY BASE ACCESS USER_ID

          cleanup() {
            curl --silent --show-error \
              -H "apikey: $KEY" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
              --data '{"action":"delete_account","confirm_phrase":"DELETE MY ACCOUNT"}' \
              "$BASE/functions/v1/privacy-service" > /tmp/cleanup.json || true
          }
          trap cleanup EXIT

          STAMP=$(date +%s%N)
          AI=$(curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            --data "{\"user_id\":\"$USER_ID\",\"local_id\":\"ah9-smoke-ai-$STAMP\",\"name\":\"Smoke Companion\",\"voice_id\":\"female-adult\"}" \
            "$BASE/rest/v1/ai_entities")
          AI_ID=$(jq -r '.[0].id // empty' <<<"$AI")
          test -n "$AI_ID"
          CONVERSATION=$(curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            --data "{\"user_id\":\"$USER_ID\",\"ai_entity_id\":\"$AI_ID\",\"local_id\":\"ah9-smoke-conversation-$STAMP\",\"title\":\"Live smoke\"}" \
            "$BASE/rest/v1/conversations")
          CONVERSATION_ID=$(jq -r '.[0].id // empty' <<<"$CONVERSATION")
          test -n "$CONVERSATION_ID"
          REQUEST_ID="ah9-smoke-request-$STAMP"
          export AI_ID CONVERSATION_ID REQUEST_ID

          curl --fail --silent --show-error -H "apikey: $KEY" "$BASE/functions/v1/health" > /tmp/health.json

          CHAT_NOAUTH=$(curl --silent --output /tmp/chat-noauth.json --write-out '%{http_code}' \
            -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{}' "$BASE/functions/v1/chat-stream")
          VOICE_NOAUTH=$(curl --silent --output /tmp/voice-noauth.json --write-out '%{http_code}' \
            -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{}' "$BASE/functions/v1/voice-service")
          test "$CHAT_NOAUTH" = 401
          test "$VOICE_NOAUTH" = 401
          export CHAT_NOAUTH VOICE_NOAUTH

          python3 - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['BASE']
          headers={
            'apikey':os.environ['KEY'],
            'Authorization':f"Bearer {os.environ['ACCESS']}",
            'Content-Type':'application/json',
            'Accept':'text/event-stream',
          }
          payload={
            'ai_entity_id':os.environ['AI_ID'],
            'conversation_id':os.environ['CONVERSATION_ID'],
            'user_message':'Share one short thought about learning something new.',
            'request_id':os.environ['REQUEST_ID'],
            'local_user_message_id':'smoke-local-user',
            'local_ai_message_id':'smoke-local-ai',
          }
          def read_stream(payload):
            req=urllib.request.Request(base+'/functions/v1/chat-stream',data=json.dumps(payload).encode(),headers=headers,method='POST')
            started=time.monotonic()
            events=[]
            current=None
            first_delta=None
            done_at=None
            done_data={}
            with urllib.request.urlopen(req,timeout=35) as response:
              assert response.status==200
              assert 'text/event-stream' in response.headers.get('Content-Type','')
              for raw in response:
                line=raw.decode('utf-8').rstrip('\r\n')
                if line.startswith('event:'):
                  current=line.split(':',1)[1].strip()
                elif line.startswith('data:'):
                  data=json.loads(line.split(':',1)[1].strip())
                  elapsed=round((time.monotonic()-started)*1000)
                  events.append({'type':current,'atMs':elapsed})
                  if current=='delta' and first_delta is None: first_delta=elapsed
                  if current=='done': done_at=elapsed; done_data=data
                  if current=='error': raise AssertionError(f"stream error {data.get('code')}")
            return {'events':events,'firstDeltaMs':first_delta,'doneMs':done_at,'doneData':done_data}
          first=read_stream(payload)
          assert first['firstDeltaMs'] is not None
          assert first['doneMs'] is not None
          types=[event['type'] for event in first['events']]
          assert 'ack' in types and 'delta' in types and 'metadata' in types and 'done' in types
          assert types.index('ack') < types.index('delta') < types.index('done')
          replay=read_stream(payload)
          assert replay['doneData'].get('replayed') is True
          receipt={
            'stream':{
              'eventTypes':types,
              'firstDeltaMs':first['firstDeltaMs'],
              'doneMs':first['doneMs'],
              'providerMode':first['doneData'].get('providerMode'),
              'replayConfirmed':True,
            }
          }
          open('/tmp/stream.json','w').write(json.dumps(receipt))
          PY

          VOICE_STARTED=$(date +%s%3N)
          curl --fail --silent --show-error -D /tmp/voice.headers -o /tmp/voice.mp3 \
            -H "apikey: $KEY" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            --data "{\"preview\":true,\"voice_id\":\"female-adult\",\"request_id\":\"ah9-smoke-voice-$STAMP\"}" \
            "$BASE/functions/v1/voice-service"
          VOICE_DONE=$(date +%s%3N)
          VOICE_BYTES=$(wc -c < /tmp/voice.mp3)
          test "$VOICE_BYTES" -gt 1000
          VOICE_PROVIDER=$(awk -F': ' 'tolower($1)=="x-ah-voice-provider" {gsub("\\r", "", $2); print tolower($2)}' /tmp/voice.headers | tail -1)
          VOICE_TYPE=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\\r", "", $2); print tolower($2)}' /tmp/voice.headers | tail -1)
          test "$VOICE_PROVIDER" = openai -o "$VOICE_PROVIDER" = elevenlabs
          [[ "$VOICE_TYPE" == audio/* ]]
          export VOICE_PROVIDER VOICE_TYPE VOICE_BYTES VOICE_MS=$((VOICE_DONE-VOICE_STARTED))

          CLEANUP=$(curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            --data '{"action":"delete_account","confirm_phrase":"DELETE MY ACCOUNT"}' \
            "$BASE/functions/v1/privacy-service")
          jq -e '.status == "account_deleted"' <<<"$CLEANUP" >/dev/null
          echo '{"status":"account_deleted"}' > /tmp/cleanup.json
          trap - EXIT

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health=json.loads(Path('/tmp/health.json').read_text())
          receipt=json.loads(Path('/tmp/stream.json').read_text())
          receipt.update({
            'status':'PASSED',
            'health':{
              'database':health.get('database'),
              'aiConfigured':health.get('ai_configured'),
              'chatStreamConfigured':health.get('chat_stream_configured'),
              'neuralVoiceConfigured':health.get('neural_voice_configured'),
              'neuralVoiceProvider':health.get('neural_voice_provider'),
              'elevenLabsConfigured':health.get('elevenlabs_configured'),
              'transcriptionConfigured':health.get('transcription_configured'),
            },
            'voice':{
              'provider':os.environ['VOICE_PROVIDER'],
              'contentType':os.environ['VOICE_TYPE'],
              'audioBytes':int(os.environ['VOICE_BYTES']),
              'completeMs':int(os.environ['VOICE_MS']),
            },
            'jwtBoundary':{
              'chatStreamWithoutUserToken':int(os.environ['CHAT_NOAUTH']),
              'voiceServiceWithoutUserToken':int(os.environ['VOICE_NOAUTH']),
            },
            'cleanup':'account_deleted',
            'storedConversationText':False,
            'storedAudio':False,
            'easBuildsRun':0,
            'testFlightUploadsRun':0,
          })
          Path('ALMOST_HUMAN_9_LIVE_SMOKE.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Save sanitized receipt and remove one-time lane
        shell: bash
        run: |
          set -euo pipefail
          rm .github/run-ah9-live-smoke.json
          rm .github/workflows/smoke-ah9-live-services.yml
          git config user.name 'Almost Human 9.0 Live Smoke'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add -A
          git commit -m 'test: record Almost Human 9.0 live service smoke'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
