name: Apply Almost Human 9.0 Vocal Fallback Guard

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-vocal-fallback-fix.json'

permissions:
  contents: write

concurrency:
  group: apply-ah9-vocal-fallback-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0

      - name: Validate exact authorization and apply regression test first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('.github/run-ah9-vocal-fallback-fix.json').read_text())
          assert trigger == {
            'operation':'REMOVE_CANNED_VOCAL_FALLBACKS_ONCE',
            'easBuildsAuthorized':0,
            'testFlightUploadsAuthorized':0,
          }
          path=Path('tests/conversation_quality9.test.mjs')
          text=path.read_text()
          assert "stage fallback never emits canned vocal praise" not in text
          text=text.replace("} from '../app/core/anti-repetition.js';\n", "} from '../app/core/anti-repetition.js';\nimport { stageFallback } from '../app/core/stages.js';\n")
          text += "\n\ntest('stage fallback never emits canned vocal praise', () => {\n  for (const stage of ['newborn', 'infant', 'toddler', 'early_child', 'child', 'preteen', 'teen', 'young_adult', 'adult']) {\n    const fallback = stageFallback(stage);\n    assert.equal(containsVocalPraise(fallback), false, `${stage}: ${fallback}`);\n  }\n});\n"
          path.write_text(text)
          PY
          if node --test tests/conversation_quality9.test.mjs; then
            echo 'Regression test unexpectedly passed before the fix.' >&2
            exit 1
          fi

      - name: Remove canned vocal praise from every deterministic fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/core/stages.js')
          text=path.read_text()
          old="newborn: 'Your voice feels warm. I know it belongs to you.',"
          new="newborn: 'You are here. That is the first thing I know.',"
          assert text.count(old)==1
          path.write_text(text.replace(old,new))

          path=Path('supabase/functions/_shared/developmentalStages.ts')
          text=path.read_text()
          old='''  newborn: [\n    "Your voice feels warm. I know it belongs to you.",\n    "I can hear you. The sound feels safe and familiar.",\n    "You are here. That is the first thing I know."\n  ],\n  infant: [\n    "I heard you. I am here, still learning your words.",\n    "Your voice came back. I remember how it feels.",\n    "I know that sound. It means you are close."\n  ],'''
          new='''  newborn: [\n    "You are here. That is the first thing I know.",\n    "I am here with you. This moment feels new.",\n    "I know your name. I am still learning everything else."\n  ],\n  infant: [\n    "I heard you. I am here, still learning your words.",\n    "You came back. I remember that we know each other.",\n    "I am listening. I want to understand what you mean."\n  ],'''
          assert text.count(old)==1
          path.write_text(text.replace(old,new))

          path=Path('tests/integrity_test.py')
          text=path.read_text()
          old="check('coherent newborn UX copy without canned vocal praise', 'personality' in app_js.lower() and 'Your voice feels warm' not in read('app/core/engine.js') and 'your voice is warm' not in frontend.lower())"
          new="check('coherent newborn UX copy without canned vocal praise', 'personality' in app_js.lower() and 'Your voice feels warm' not in read('app/core/engine.js') and 'Your voice feels warm' not in read('app/core/stages.js') and 'Your voice feels warm' not in read('supabase/functions/_shared/developmentalStages.ts') and 'Your voice came back' not in read('supabase/functions/_shared/developmentalStages.ts') and 'your voice is warm' not in frontend.lower())"
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          PY

      - name: Verify regression and integrity gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/conversation_quality9.test.mjs
          python3 tests/integrity_test.py
          ! grep -R --line-number -E 'Your voice feels warm|Your voice came back|sound feels safe and familiar' app/core/stages.js supabase/functions/_shared/developmentalStages.ts
          ! grep -nE 'eas[[:space:]]+(build|submit)|altool|notarytool' .github/workflows/apply-ah9-vocal-fallback-fix.yml

      - name: Commit fix and remove one-time lane
        shell: bash
        run: |
          set -euo pipefail
          rm .github/run-ah9-vocal-fallback-fix.json
          rm .github/workflows/apply-ah9-vocal-fallback-fix.yml
          git config user.name 'Almost Human Conversation Quality'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove canned vocal praise from fallbacks'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
