name: Almost Human 9.0 Protected iOS Build Attempt 2

on:
  push:
    branches: [main]
    paths:
      - '.github/run-v90-ios-build-v2.json'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: almost-human-v90-ios-build
  cancel-in-progress: false

env:
  EXPECTED_OWNER: wscott2k8
  EXPECTED_BUNDLE_ID: com.stormandme.almosthuman
  EXPECTED_EAS_PROJECT_ID: cd0be7bb-e65a-454e-b255-3b261de060ee
  EXPECTED_RELEASE_CHANNEL: haven-9.0-conversation-first
  EXPECTED_PRIOR_BUILD_ID: 61c38061-c2e0-43f5-b8a2-43b0af8cd187
  EXPECTED_PRIOR_BUILD_NUMBER: '3'
  EXPECTED_NEW_BUILD_NUMBER: '4'
  CERTIFIED_SOURCE_COMMIT: f569adfc33e6a48b8aef28501c0124c2a356e237
  WEB_BUILD_HASH: 07db3f766057641e56682919f4b05bb1c16b080e766e05c79fab09a31928a87e

jobs:
  certify-and-build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out canonical main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact carried-forward one-build authorization
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const trigger = require('./.github/run-v90-ios-build-v2.json');
          const expected = {
            operation: 'BUILD_V90_ONCE',
            confirm: 'BUILD_V90_ONCE',
            attempt: 2,
            priorRunId: 30678930708,
            priorAttemptBuildRequestSubmitted: false,
            expectedOwner: process.env.EXPECTED_OWNER,
            expectedBundleId: process.env.EXPECTED_BUNDLE_ID,
            expectedEasProjectId: process.env.EXPECTED_EAS_PROJECT_ID,
            expectedReleaseChannel: process.env.EXPECTED_RELEASE_CHANNEL,
            expectedPriorBuildId: process.env.EXPECTED_PRIOR_BUILD_ID,
            expectedPriorBuildNumber: process.env.EXPECTED_PRIOR_BUILD_NUMBER,
            certifiedSourceCommit: process.env.CERTIFIED_SOURCE_COMMIT,
            easBuildCreditsAuthorized: 1,
            easSubmissionsAuthorized: 0,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (String(trigger[key] ?? '') !== String(value)) throw new Error(`${key} mismatch`);
          }
          const workflow = fs.readFileSync('.github/workflows/almost-human-v90-ios-build-v2.yml', 'utf8').toLowerCase();
          if (/\beas\s+submit\b/.test(workflow) || /\baltool\b/.test(workflow) || /\bnotarytool\b/.test(workflow)) {
            throw new Error('Submission or notarization command detected');
          }
          console.log('One unspent iOS build authorization carried forward; submissions remain zero.');
          NODE

      - name: Preserve builds 2 and 3 and refuse duplicate build 4
        shell: bash
        run: |
          set -euo pipefail
          test -f STEP7_IOS_BUILD_RECORD.json
          test -f STEP8_IOS_BUILD_RECORD.json
          test ! -f STEP9_IOS_BUILD_RECORD.json
          node - <<'NODE'
          const build2 = require('./STEP7_IOS_BUILD_RECORD.json');
          const build3 = require('./STEP8_IOS_BUILD_RECORD.json');
          if (build2.status !== 'FINISHED' || String(build2.appBuildVersion) !== '2') throw new Error('Build 2 receipt changed');
          if (build3.status !== 'FINISHED' || String(build3.appBuildVersion) !== process.env.EXPECTED_PRIOR_BUILD_NUMBER) throw new Error('Build 3 receipt changed');
          if (build3.buildId !== process.env.EXPECTED_PRIOR_BUILD_ID) throw new Error('Build 3 ID changed');
          if (Number(build3.testFlightSubmissionsRun || 0) !== 0) throw new Error('Unexpected build 3 submission');
          NODE

      - name: Require exact synced 9.0 application source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CERTIFIED_SOURCE_COMMIT" HEAD
          git diff --quiet "$CERTIFIED_SOURCE_COMMIT" HEAD -- \
            app mobile supabase scripts tests package.json package-lock.json tsconfig.edge.json vercel.json
          test -f ALMOST_HUMAN_9_CERTIFICATION.md
          test -f ALMOST_HUMAN_9_RELEASE_CANDIDATE.json
          test -f ALMOST_HUMAN_9_WEB_DEPLOYMENT.json
          test -f RELEASE_STATUS.md
          node - <<'NODE'
          const candidate = require('./ALMOST_HUMAN_9_RELEASE_CANDIDATE.json');
          const deployment = require('./ALMOST_HUMAN_9_WEB_DEPLOYMENT.json');
          const app = require('./mobile/app.json').expo || {};
          if (candidate.status !== 'WEB_BACKEND_RELEASE_CANDIDATE_CERTIFIED' || candidate.version !== '9.0.0') throw new Error('Wrong certified candidate');
          if (candidate.readyForOnePaidIosBuildAuthorization !== true) throw new Error('Candidate is not build-authorized');
          if (Number(candidate.easBuildsRun) !== 0 || Number(candidate.testFlightUploadsRun) !== 0) throw new Error('9.0 release counters are not zero');
          if (candidate.tests?.webBackendSecurityPasses !== 4 || candidate.tests?.mobilePreflightPasses !== 4 || candidate.tests?.finalLiveVerification !== 'PASSED') throw new Error('Certification evidence is incomplete');
          if (deployment.status !== 'READY' || deployment.version !== '9.0.0' || deployment.contentHash !== process.env.WEB_BUILD_HASH) throw new Error('Production deployment receipt mismatch');
          if (app.owner !== process.env.EXPECTED_OWNER) throw new Error('Expo owner mismatch');
          if (app.ios?.bundleIdentifier !== process.env.EXPECTED_BUNDLE_ID || app.android?.package !== process.env.EXPECTED_BUNDLE_ID) throw new Error('Application identifier mismatch');
          if (app.extra?.eas?.projectId !== process.env.EXPECTED_EAS_PROJECT_ID) throw new Error('EAS project mismatch');
          if (app.extra?.releaseChannel !== process.env.EXPECTED_RELEASE_CHANNEL) throw new Error('Release channel mismatch');
          NODE
          ! grep -R --line-number -E 'Your voice feels warm|Your voice came back|sound feels safe and familiar' \
            app/core/stages.js supabase/functions/_shared/developmentalStages.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify protected Expo account
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          ACCOUNT="$(eas whoami | tr -d '\r' | head -n 1 | awk '{print $1}')"
          echo "Expo account: $ACCOUNT"
          test "$ACCOUNT" = "$EXPECTED_OWNER"

      - name: Re-run complete web backend and security gate four times
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:quadruple
          node -e "const b=require('./dist/build-meta.json'); if(b.version!=='9.0.0'||b.contentHash!==process.env.WEB_BUILD_HASH)throw Error('Built web does not match certified production');"

      - name: Prove the offline native bundle is synchronized
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-inline.mjs
          git diff --quiet -- mobile/assets/almost-human.html mobile/src/almostHumanHtml.ts

      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Re-run all mobile gates and no-credit exports
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo install --check
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android

      - name: Verify canonical EAS project without relinking
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas project:info --non-interactive | tee ../v90-eas-project-info.txt
          node -e "const a=require('./app.json').expo||{}; if(a.owner!==process.env.EXPECTED_OWNER||a.ios?.bundleIdentifier!==process.env.EXPECTED_BUNDLE_ID||a.extra?.eas?.projectId!==process.env.EXPECTED_EAS_PROJECT_ID)throw Error('Canonical EAS identity changed');"
          git diff --quiet -- app.json eas.json package-lock.json assets/almost-human.html src/almostHumanHtml.ts

      - name: Confirm build 3 remains latest before spending
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build:list --platform ios --limit 50 --json --non-interactive > ../v90-ios-before.json
          node - <<'NODE'
          const raw = require('../v90-ios-before.json');
          const builds = Array.isArray(raw) ? raw : (raw.builds || []);
          if (!Array.isArray(builds) || !builds.length) throw new Error('No EAS iOS inventory returned');
          const prior = builds.find((build) => build.id === process.env.EXPECTED_PRIOR_BUILD_ID);
          if (!prior || String(prior.appBuildVersion) !== process.env.EXPECTED_PRIOR_BUILD_NUMBER || String(prior.status || '').toLowerCase() !== 'finished') throw new Error('Preserved build 3 is not intact in EAS');
          const newer = builds.filter((build) => Number(build.appBuildVersion) > Number(process.env.EXPECTED_PRIOR_BUILD_NUMBER));
          if (newer.length) throw new Error('A newer build already exists; refusing another credit: ' + newer.map((build) => `${build.id}:${build.appBuildVersion}:${build.status}`).join(', '));
          console.log('Build 3 is latest; one build request may proceed.');
          NODE

      - name: Spend exactly one production iOS build credit
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --wait --json > ../v90-ios-build.json
          node -e "const x=require('../v90-ios-build.json'); console.log(JSON.stringify(x,null,2));"

      - name: Record successful build 4 without submitting it
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const raw = require('./v90-ios-build.json');
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build?.id) throw new Error('EAS returned no build ID');
          if (String(build.status || '').toLowerCase() !== 'finished') throw new Error('Build did not finish: ' + build.status);
          if (String(build.appBuildVersion) !== process.env.EXPECTED_NEW_BUILD_NUMBER) throw new Error(`Expected build 4; received ${build.appBuildVersion}`);
          const record = {
            status: build.status,
            product: 'Almost Human',
            releaseVersion: '9.0.0',
            buildId: build.id,
            platform: build.platform || 'IOS',
            appVersion: build.appVersion || '1.0.0',
            appBuildVersion: String(build.appBuildVersion),
            artifacts: build.artifacts || null,
            buildDetailsPageUrl: build.buildDetailsPageUrl || null,
            createdAt: build.createdAt || new Date().toISOString(),
            githubRunId: process.env.GITHUB_RUN_ID,
            sourceCommit: cp.execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim(),
            certifiedSourceCommit: process.env.CERTIFIED_SOURCE_COMMIT,
            priorBuildId: process.env.EXPECTED_PRIOR_BUILD_ID,
            priorBuildNumber: process.env.EXPECTED_PRIOR_BUILD_NUMBER,
            easBuildCreditsUsedForThisRelease: 1,
            testFlightSubmissionsRun: 0,
          };
          fs.writeFileSync('STEP9_IOS_BUILD_RECORD.json', JSON.stringify(record, null, 2) + '\n');
          const candidate = require('./ALMOST_HUMAN_9_RELEASE_CANDIDATE.json');
          candidate.tests = { ...(candidate.tests || {}), signedIosBuild: true };
          candidate.signedIosBuild = { status: record.status, buildId: record.buildId, appBuildVersion: record.appBuildVersion, createdAt: record.createdAt, sourceCommit: record.sourceCommit, certifiedSourceCommit: record.certifiedSourceCommit, testFlightSubmissionsRun: 0 };
          candidate.readyForOnePaidIosBuildAuthorization = false;
          candidate.easBuildsRun = 1;
          candidate.testFlightUploadsRun = 0;
          candidate.knownLimitations = (candidate.knownLimitations || []).filter((item) => !String(item).includes('requires a future signed iOS build'));
          fs.writeFileSync('ALMOST_HUMAN_9_RELEASE_CANDIDATE.json', JSON.stringify(candidate, null, 2) + '\n');
          fs.writeFileSync('RELEASE_STATUS.md', `# Almost Human 9.0 release status\n\n## Complete\n\n- Conversation-first 9.0 interface, secure neural voice, secure transcription, and synchronized offline native bundle.\n- Production web and backend are live and certified.\n- Four complete web/backend/security passes and four mobile preflight passes succeeded.\n- Signed Almost Human 9.0 iOS build ${record.appBuildVersion}: \`${record.buildId}\`.\n- Existing user data and prior signed builds 2 and 3 are preserved.\n\n## Next controlled step\n\nTestFlight submission requires separate explicit authorization and has not been run.\n\n## Credit boundary\n\n- EAS builds run for 9.0: **1**\n- TestFlight uploads run for 9.0: **0**\n`);
          NODE
          git config user.name 'Almost Human 9.0 Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add STEP9_IOS_BUILD_RECORD.json ALMOST_HUMAN_9_RELEASE_CANDIDATE.json RELEASE_STATUS.md
          git commit -m 'Record successful Almost Human 9.0 iOS build'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Save signed-build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-human-v90-ios-attempt-2-records
          path: |
            v90-ios-before.json
            v90-ios-build.json
            v90-eas-project-info.txt
            mobile/STEP7_PREFLIGHT.json
            mobile/STEP7_QUADRUPLE_PREFLIGHT.md
            STEP9_IOS_BUILD_RECORD.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report exact blocker without retrying
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Almost Human 9.0 iOS build attempt 2 needs attention — run $GITHUB_RUN_ID" \
            --body "The protected 9.0 build-only lane stopped. Do not rerun blindly. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. TestFlight submissions remain unauthorized."
