name: Repair Almost Human 9.0 Live Smoke Guard

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-smoke-guard-repair.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0
      - name: Replace self-matching guard and advance smoke attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          auth=json.loads(Path('.github/run-ah9-smoke-guard-repair.json').read_text())
          assert auth=={'operation':'REPAIR_SMOKE_GUARD_ONCE'}
          path=Path('.github/workflows/smoke-ah9-live-services.yml')
          text=path.read_text()
          old="          ! grep -nE 'eas[[:space:]]+(build|submit)|altool|notarytool' .github/workflows/smoke-ah9-live-services.yml"
          new="""          python3 - <<'PYSAFE'\n          from pathlib import Path\n          text=Path('.github/workflows/smoke-ah9-live-services.yml').read_text().lower()\n          forbidden=['eas '+'build','eas '+'submit','al'+'tool','notary'+'tool']\n          assert not any(value in text for value in forbidden)\n          PYSAFE"""
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          trigger_path=Path('.github/run-ah9-live-smoke.json')
          trigger=json.loads(trigger_path.read_text())
          trigger['attempt']=2
          trigger_path.write_text(json.dumps(trigger,indent=2)+'\n')
          PY
          rm .github/run-ah9-smoke-guard-repair.json
          rm .github/workflows/repair-ah9-smoke-guard.yml
          git config user.name 'Almost Human 9.0 Smoke Repair'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add -A
          git commit -m 'ci: repair live smoke safety guard'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
