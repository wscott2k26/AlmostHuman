name: Almost Human 9.0 One iOS Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/run-almost-human-9-ios-build.json'

permissions:
  contents: write

concurrency:
  group: almost-human-9-one-ios-build
  cancel-in-progress: false

jobs:
  certify-and-build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Verify exact one-build authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('.github/run-almost-human-9-ios-build.json').read_text())
          assert trigger['operation']=='BUILD_ALMOST_HUMAN_9_IOS_ONCE'
          assert trigger['easBuildCreditsAuthorized']==1
          assert trigger['testFlightUploadsAuthorized']==0
          assert trigger['projectId']=='cd0be7bb-e65a-454e-b255-3b261de060ee'
          assert trigger['bundleIdentifier']=='com.stormandme.almosthuman'
          assert trigger['sourceCommit']=='3015a1572e2708646ac87ca4fc16655b2941097f'
          assert not Path('ALMOST_HUMAN_9_IOS_BUILD.json').exists(), '9.0 iOS build receipt already exists'
          PY

      - name: Run complete no-credit source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:quadruple
          cd mobile
          npm ci
          npm run doctor
          npm run typecheck
          npm run lint
          npm run preflight:quadruple
          npm run export:ios

      - name: Verify Expo identity and exact project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami
          npx eas-cli@latest project:info --json --non-interactive > /tmp/eas-project.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/eas-project.json').read_text())
          project_id=(data.get('id') or data.get('projectId') or (data.get('project') or {}).get('id'))
          assert project_id=='cd0be7bb-e65a-454e-b255-3b261de060ee', project_id
          app=json.loads(Path('app.json').read_text())['expo']
          assert app['owner']=='wscott2k8'
          assert app['slug']=='almost-human'
          assert app['ios']['bundleIdentifier']=='com.stormandme.almosthuman'
          assert app['extra']['eas']['projectId']=='cd0be7bb-e65a-454e-b255-3b261de060ee'
          PY

      - name: Build exactly one signed production iOS artifact
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > /tmp/eas-ios-build.json

      - name: Record successful signed build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          raw=json.loads(Path('/tmp/eas-ios-build.json').read_text())
          build=raw[0] if isinstance(raw,list) else raw
          status=str(build.get('status','')).upper()
          assert status in ('FINISHED','SUCCESS','COMPLETED'), status
          build_id=build.get('id')
          assert build_id
          artifacts=build.get('artifacts') or {}
          artifact_url=artifacts.get('buildUrl') or artifacts.get('applicationArchiveUrl') or build.get('artifactUrl')
          receipt={
            'status':'FINISHED',
            'product':'Almost Human',
            'release':'9.0',
            'platform':'IOS',
            'buildId':build_id,
            'appVersion':build.get('appVersion'),
            'appBuildVersion':build.get('appBuildVersion'),
            'artifactUrl':artifact_url,
            'easProjectId':'cd0be7bb-e65a-454e-b255-3b261de060ee',
            'bundleIdentifier':'com.stormandme.almosthuman',
            'sourceCommit':'3015a1572e2708646ac87ca4fc16655b2941097f',
            'authorization':{
              'easBuildCredits':1,
              'testFlightUploads':0,
            },
            'githubRunId':os.environ.get('GITHUB_RUN_ID'),
            'recordedAt':datetime.now(timezone.utc).isoformat(),
          }
          Path('ALMOST_HUMAN_9_IOS_BUILD.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'Almost Human Release Bot'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_9_IOS_BUILD.json
          git commit -m 'release: record Almost Human 9.0 signed iOS build'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
