name: Measure Almost Human 9.0 Performance

on:
  push:
    branches:
      - feature/conversation-first-9-0
    paths:
      - '.github/run-ah9-performance.json'

permissions:
  contents: write

concurrency:
  group: measure-almost-human-9-performance
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: onvoaskzzxozmhkzyycy
      PRODUCTION_ORIGIN: https://almost-human-swart.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-first-9-0
          fetch-depth: 0

      - name: Validate exact zero-release authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path('.github/run-ah9-performance.json').read_text())
          assert trigger['operation']=='MEASURE_AH9_PERFORMANCE_ONCE'
          assert trigger['textTurns']==20
          assert trigger['voiceTurns']==10
          assert trigger['easBuildsAuthorized']==0
          assert trigger['testFlightUploadsAuthorized']==0
          text=Path('.github/workflows/measure-ah9-performance.yml').read_text().lower()
          forbidden=['eas '+'build','eas '+'submit','al'+'tool','notary'+'tool']
          assert not any(value in text for value in forbidden)
          PY

      - name: Run ephemeral 20-text and 10-voice harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, re, statistics, time, urllib.error, urllib.request
          from pathlib import Path

          config=Path('app/config.js').read_text()
          match=re.search(r"supabasePublishableKey:\s*'([^']+)'", config)
          assert match, 'publishable key missing'
          key=match.group(1)
          base=f"https://{os.environ['PROJECT_REF']}.supabase.co"
          origin=os.environ['PRODUCTION_ORIGIN']

          def request(path, *, data=None, token=None, headers=None, timeout=45):
            merged={'apikey':key, 'Content-Type':'application/json'}
            if token: merged['Authorization']=f'Bearer {token}'
            if headers: merged.update(headers)
            body=None if data is None else json.dumps(data).encode()
            req=urllib.request.Request(base+path, data=body, headers=merged, method='GET' if data is None else 'POST')
            return urllib.request.urlopen(req, timeout=timeout)

          auth=json.loads(request('/auth/v1/signup', data={'data':{'source':'ah9_performance_harness'}}).read())
          token=auth['access_token']
          user_id=auth['user']['id']

          def cleanup():
            try:
              response=request('/functions/v1/privacy-service', token=token, data={'action':'delete_account','confirm_phrase':'DELETE MY ACCOUNT'})
              result=json.loads(response.read())
              return result.get('status')=='account_deleted'
            except Exception:
              return False

          try:
            stamp=str(time.time_ns())
            ai=json.loads(request('/rest/v1/ai_entities', token=token, headers={'Prefer':'return=representation'}, data={
              'user_id':user_id,
              'local_id':f'ah9-perf-ai-{stamp}',
              'name':'Performance Companion',
              'voice_id':'female-adult',
            }).read())[0]
            conversation=json.loads(request('/rest/v1/conversations', token=token, headers={'Prefer':'return=representation'}, data={
              'user_id':user_id,
              'ai_entity_id':ai['id'],
              'local_id':f'ah9-perf-conversation-{stamp}',
              'title':'Performance harness',
            }).read())[0]

            health_req=urllib.request.Request(base+'/functions/v1/health', headers={'apikey':key,'Origin':origin}, method='GET')
            with urllib.request.urlopen(health_req, timeout=30) as health_response:
              health=json.loads(health_response.read())
              cors_origin=health_response.headers.get('Access-Control-Allow-Origin')

            def measure_stream(index):
              payload={
                'ai_entity_id':ai['id'],
                'conversation_id':conversation['id'],
                'user_message':f'Share one distinct short thought about learning, turn {index}.',
                'request_id':f'ah9-perf-chat-{stamp}-{index}',
                'local_user_message_id':f'perf-user-{index}',
                'local_ai_message_id':f'perf-ai-{index}',
              }
              headers={
                'apikey':key,
                'Authorization':f'Bearer {token}',
                'Content-Type':'application/json',
                'Accept':'text/event-stream',
                'Origin':origin,
              }
              req=urllib.request.Request(base+'/functions/v1/chat-stream', data=json.dumps(payload).encode(), headers=headers, method='POST')
              started=time.monotonic()
              current=None
              first_delta=None
              done_ms=None
              provider=None
              events=[]
              with urllib.request.urlopen(req, timeout=45) as response:
                response_cors=response.headers.get('Access-Control-Allow-Origin')
                for raw in response:
                  line=raw.decode('utf-8').rstrip('\r\n')
                  if line.startswith('event:'):
                    current=line.split(':',1)[1].strip()
                  elif line.startswith('data:'):
                    data=json.loads(line.split(':',1)[1].strip())
                    elapsed=round((time.monotonic()-started)*1000)
                    events.append(current)
                    if current=='delta' and first_delta is None: first_delta=elapsed
                    if current=='done':
                      done_ms=elapsed
                      provider=data.get('providerMode')
                    if current=='error':
                      raise RuntimeError(f"chat stream error: {data.get('code')}")
              assert first_delta is not None and done_ms is not None
              assert events.index('ack') < events.index('delta') < events.index('done')
              return {
                'turn':index,
                'startClass':'cold' if index==1 else 'warm',
                'firstDeltaMs':first_delta,
                'doneMs':done_ms,
                'providerMode':provider,
                'corsOrigin':response_cors,
              }

            text_samples=[]
            for index in range(1,21):
              text_samples.append(measure_stream(index))
              time.sleep(.2)

            voice_samples=[]
            for index in range(1,11):
              voice_started=time.monotonic()
              with request('/functions/v1/voice-service', token=token, headers={'Origin':origin}, data={
                'preview':True,
                'voice_id':'female-adult' if index%2 else 'male-adult',
                'request_id':f'ah9-perf-voice-{stamp}-{index}',
              }) as response:
                audio=response.read()
                elapsed=round((time.monotonic()-voice_started)*1000)
                provider=response.headers.get('X-AH-Voice-Provider')
                content_type=response.headers.get('Content-Type')
                response_cors=response.headers.get('Access-Control-Allow-Origin')
              assert len(audio)>1000
              assert content_type and content_type.startswith('audio/')
              assert provider in ('openai','elevenlabs')
              voice_samples.append({
                'turn':index,
                'startClass':'cold' if index==1 else 'warm',
                'completeMs':elapsed,
                'provider':provider,
                'audioBytes':len(audio),
                'corsOrigin':response_cors,
              })
              time.sleep(.2)

            def percentile(values, fraction):
              ordered=sorted(values)
              return ordered[max(0, math.ceil(len(ordered)*fraction)-1)]

            first_delta=[sample['firstDeltaMs'] for sample in text_samples]
            done=[sample['doneMs'] for sample in text_samples]
            voice=[sample['completeMs'] for sample in voice_samples]
            warm_first=[sample['firstDeltaMs'] for sample in text_samples if sample['startClass']=='warm']
            warm_done=[sample['doneMs'] for sample in text_samples if sample['startClass']=='warm']
            warm_voice=[sample['completeMs'] for sample in voice_samples if sample['startClass']=='warm']

            receipt={
              'status':'PASSED',
              'measuredAt':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'sourceCommit':os.popen('git rev-parse HEAD').read().strip(),
              'counts':{'textTurns':len(text_samples),'voiceTurns':len(voice_samples)},
              'health':{
                'database':health.get('database'),
                'chatStreamConfigured':health.get('chat_stream_configured'),
                'neuralVoiceConfigured':health.get('neural_voice_configured'),
                'neuralVoiceProvider':health.get('neural_voice_provider'),
                'transcriptionConfigured':health.get('transcription_configured'),
              },
              'cors':{
                'requestedOrigin':origin,
                'healthAllowOrigin':cors_origin,
                'chatAllowOrigins':sorted(set(sample['corsOrigin'] for sample in text_samples)),
                'voiceAllowOrigins':sorted(set(sample['corsOrigin'] for sample in voice_samples)),
                'exactProductionOrigin':cors_origin==origin and all(sample['corsOrigin']==origin for sample in text_samples+voice_samples),
              },
              'text':{
                'coldFirstDeltaMs':text_samples[0]['firstDeltaMs'],
                'coldDoneMs':text_samples[0]['doneMs'],
                'medianFirstDeltaMs':round(statistics.median(first_delta)),
                'p95FirstDeltaMs':percentile(first_delta,.95),
                'medianDoneMs':round(statistics.median(done)),
                'p95DoneMs':percentile(done,.95),
                'warmMedianFirstDeltaMs':round(statistics.median(warm_first)),
                'warmP95FirstDeltaMs':percentile(warm_first,.95),
                'warmMedianDoneMs':round(statistics.median(warm_done)),
                'warmP95DoneMs':percentile(warm_done,.95),
                'providerModes':sorted(set(sample['providerMode'] for sample in text_samples)),
                'samples':text_samples,
              },
              'voice':{
                'coldCompleteMs':voice_samples[0]['completeMs'],
                'medianCompleteMs':round(statistics.median(voice)),
                'p95CompleteMs':percentile(voice,.95),
                'warmMedianCompleteMs':round(statistics.median(warm_voice)),
                'warmP95CompleteMs':percentile(warm_voice,.95),
                'providers':sorted(set(sample['provider'] for sample in voice_samples)),
                'samples':voice_samples,
              },
              'privacy':{'storedConversationText':False,'storedAudio':False},
              'easBuildsRun':0,
              'testFlightUploadsRun':0,
            }
            deleted=cleanup()
            receipt['privacy']['ephemeralAccountDeleted']=deleted
            assert deleted
            Path('ALMOST_HUMAN_9_PERFORMANCE.json').write_text(json.dumps(receipt,indent=2)+'\n')
          except Exception:
            cleanup()
            raise
          PY

      - name: Save sanitized performance receipt and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/run-ah9-performance.json
          rm .github/workflows/measure-ah9-performance.yml
          git config user.name 'Almost Human 9.0 Performance'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add -A
          git commit -m 'test: record Almost Human 9.0 performance evidence'
          git pull --rebase origin feature/conversation-first-9-0
          git push origin HEAD:feature/conversation-first-9-0
