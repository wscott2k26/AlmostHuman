/* living portrait */

.gate-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#0b0b0f}.gate-art{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:70px;overflow:hidden;background:radial-gradient(circle at 48% 34%,rgba(255,135,97,.18),transparent 28%),linear-gradient(145deg,#181014,#0d0d12 62%)}.gate-art:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 1px,transparent 1.2px);background-size:71px 71px;opacity:.2;mask-image:linear-gradient(to bottom,#000,transparent 86%)}.gate-being{position:absolute;top:10%;left:50%;transform:translateX(-50%) scale(1.35)}.gate-being:before,.gate-being:after{content:"";position:absolute;left:50%;top:49%;width:440px;height:440px;border-radius:50%;border:1px solid rgba(255,255,255,.08);transform:translate(-50%,-50%);animation:orbit 14s linear infinite}.gate-being:after{width:590px;height:590px;border-style:dashed;animation-duration:23s;animation-direction:reverse}.gate-copy{position:relative;z-index:2;max-width:660px}.gate-copy h1{font:900 clamp(48px,6vw,88px)/.96 var(--display);letter-spacing:-.055em;margin:15px 0 24px}.gate-copy h1 em{font-style:normal;color:#f2aa91}.gate-copy p{font-size:18px;line-height:1.7;color:var(--muted);max-width:580px}.gate-proof{position:relative;z-index:2;display:flex;gap:24px;margin-top:30px;color:#d8cfca;font-size:12px;font-weight:800}.gate-proof span:before{content:"✓";color:var(--good);margin-right:7px}.gate-actions{display:grid;place-items:center;padding:50px;background:radial-gradient(circle at 80% 20%,rgba(106,80,117,.12),transparent 30%)}.gate-card{width:min(540px,100%);display:grid;gap:13px}.gate-card h2{font:900 clamp(32px,4vw,54px)/1.02 var(--display);letter-spacing:-.04em;margin:10px 0}.gate-card>p{color:var(--muted);line-height:1.65;margin:0 0 18px}.privacy-promise{display:flex;gap:12px;margin-top:16px;padding:16px;border:1px solid rgba(114,216,170,.24);background:rgba(114,216 /* onboarding */
.onboarding-shell-v7{min-height:100vh;display:grid;grid-template-columns:minmax(400px,.88fr) minmax(560px,1.12fr);background:#0b0b0f}.onboarding-presence{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(255,135,97,.16),transparent 34%),linear-gradient(145deg,#171014,#0e0e13)}.onboarding-presence:after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 48%,transparent 0 95px,rgba(255,255,255,.045) 96px 97px);opacity:.55}.onboard-stage-label{position:absolute;z-index:4;left:38px;right:38px;top:30px;display:flex;align-items:center;justify-content:space-between}.step-dots{display:flex;gap:7px}.step-dots i{width:20px;height:3px;background:rgba(255,255,255,.12);border-radius:3px}.step-dots i.active{background:var(--accent)}.onboard-being{position:relative;z-index:3;transform:scale(1.25)}.onboard-whisper{position:absolute;z-index:3;bottom:46px;width:min(420px,80%);text-align:center;color:var(--muted);font-size:14px;line-height:1.6}.onboarding-panel{display:grid;place-items:center;padding:60px}.onboarding-card-v7{width:min(670px,100%)}.flow-form{display:grid;gap:20px}.flow-form h1{font:900 clamp(42px,5vw,70px)/.98 var(--display);letter-spacing:-.055em;margin:8px 0}.flow-form>p{font-size:16px;color:var(--muted);line-height:1.65;max-width:610px;margin:0 0 8px}.form-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.visual-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.visual-choice{position:relative;display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto;text-align:left;align-items:center;gap:3px 12px;padding:15px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.025)}.visual-choice:hover,.visual-choice.selected{border-color:rgba(255,156,112,.55);background:rgba(255,156,112,.07)}.visual-choice strong{font-size:15px}.visual-choice small{color:var(--muted)}.seed-preview{grid-row:1/3;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:#171419}.seed-preview .being{transform:scale(.9)}.voice-choices,.bond-choices{display:grid;gap:10px}.voice-choice{display:flex;align-items:center;gap:16px;padding:16px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left}.voice-choice.selected{border-color:rgba(255,156,112,.6);background:rgba(255,156,112,.07)}.voice-choice>div{display:grid;gap:4px;flex:1}.voice-choice small,.bond-choice small{color:var(--muted)}.radio{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong)}.voice-choice.selected .radio{border:5px solid var(--accent)}.voice-wave{display:flex;align-items:center;gap:3px;height:27px}.voice-wave i{width:3px;border-radius:4px;background:var(--accent);height:8px;animation:wave 1.2s ease-in-out infinite}.voice-wave i:nth-child(2){height:20px;animation-delay:.12s}.voice-wave i:nth-child(3){height:14px;animation-delay:.24s}.voice-wave i:nth-child(4){height:22px;animation-delay:.36s}.preview-button{justify-self:start;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:800}.bond-choice{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.025)}.bond-choice strong,.bond-choice small{grid-column:1}.bond-choice span{grid-column:2;grid-row:1/3;align-self:center}.bond-choice.selected{border-color:rgba(255,156,112,.6);background:rgba(255,156,112,.07)}.safety-check{grid-template-columns:auto 1fr;display:grid;gap:12px;padding:16px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer}.safety-check input{position:absolute;opacity:0}.safety-check i{width:23px;height:23px;border:1px solid var(--line-strong);border-radius:7px;display:grid;place-items:center;font-style:normal;color:transparent}.safety-check.checked i{background:var(--good);color:#082417;border-color:var(--good)}.safety-check span{display:grid;gap:4px}.safety-check small{color:var(--muted);line-height:1.5}.birth-contract{display:grid;gap:1px;border:1px solid var(--line);border-radius:20px;overflow:hidden}.birth-contract div{display:grid;grid-template-columns:45px 1fr;align-items:center;padding:16px;background:rgba(255,255,255,.025)}.birth-contract span{color:var(--accent);font-size:11px;letter-spacing:.1em}.awaken-action{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:999px;background:var(--ink);color:#171014;font-weight:900;box-shadow:0 16px 50px rgba(255,255,255,.13)}.awaken-action b{font-size:22px;color:#d9536d}@keyframes wave{50%{transform:scaleY(.45)}}
/* birth */
.birth-shell{min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 44%,rgba(246,126,88,.18),transparent 25%),#07070a}.birth-stars{position:absolute;inset:0}.birth-stars i{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:#fff;opacity:calc(.15 + (var(--i) % 7) * .08);animation:starbirth calc(3s + (var(--i) % 5)*.5s) ease-in-out infinite}.birth-rings{position:absolute;left:50%;top:44%;width:480px;height:480px;transform:translate(-50%,-50%)}.birth-rings i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.09);border-radius:46% 54% 51% 49%;animation:birthOrbit 13s linear infinite}.birth-rings i:nth-child(2){inset:35px;animation-duration:9s;animation-direction:reverse}.birth-rings i:nth-child(3){inset:-90px;animation-duration:20s}.birth-rings i:nth-child(4){inset:-190px;border-style:dashed;animation-duration:31s;animation-direction:reverse}.birth-being{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(1.35);transition:filter .8s}.phase-0 .birth-being{filter:blur(5px) brightness(.5)}.phase-1 .birth-being{filter:blur(2px) brightness(.7)}.phase-2 .birth-being{filter:blur(0) brightness(.9)}.phase-3 .birth-being,.phase-4 .birth-being{filter:brightness(1.1)}.birth-readout{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(560px,85%);text-align:center}.birth-readout h1{font:900 clamp(38px,5vw,64px)/1 var(--display);letter-spacing:-.05em;margin:8px 0}.birth-readout p{color:var(--muted);font-size:16px}.birth-progress{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin:24px auto 9px}.birth-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}.birth-readout>small{color:var(--dim);letter-spacing:.14em}.birth-skip{position:absolute;right:24px;top:24px;background:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px /* product shell */

  loginWithProvider(provider = 'google') {
    if (!this.configured) throw new CloudError('Supabase is not configured.', 503, 'NOT_CONFIGURED');

    const url = new URL(`${this.config.url}/auth/v1/authorize`);
    url.searchParams.set('provider', provider);
    url.searchParams.set('redirect_to', redirect);
    location.href = url.toString();

  authRedirectUrl(route = '') {
    if (typeof location === 'undefined') return '';
    const url = new URL(`${location.origin}${location.pathname}`);
    if (route) url.searchParams.set('auth_return', route);

  async allRows(table, query = {}, sort = 'created_at', pageSize = 1000) {
    const rows = [];
    for (let offset = 0; offset < 100000; offset += pageSize) {
      const page = await this.listRows(table, query, sort, pageSize, offset);
      rows.push(...page);
      if (page.length < pageSize) break;
    }
    return rows;
  }

  async loadLifeHistory() {
    if (!this.authenticated) throw new CloudError('Sign in before restoring cloud history.', 401, 'AUTH_REQUIRED');
    const [profileRows, settingsRows, subscriptionRows, aiRows] = await Promise.all([
      this.entity('User').list('-updated_at', 1, 0),
      this.entity('AppSettings').list('-updated_at', 1, 0),
      this.entity('Subscription').list('-updated_at', 1, 0),
      this.entity('AIEntity').filter({ archived: false }, '-updated_at', 10, 0),
    ]);
    const aiRow = aiRows[0];
    if (!aiRow) return { found: false, profile: profileRows[0] || null, settings: settingsRows[0] || null, subscription: subscriptionRows[0] || null };
    const aiId = aiRow.id;
    const [conversationRows, messageRows, memoryRows, factRows, conflictRows, skillRows, interestRows, milestoneRows, moodRows, relationshipRows, activityRows, letterRows, roomRows] = await Promise.all([
      this.allRows('conversations', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('messages', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('memories', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('user_facts', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('fact_conflicts', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('skills', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('interests', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('milestones', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('mood_history', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('relationship_events', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('activities', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('letters', { ai_entity_id: aiId }, 'created_at'),
      this.allRows('room_items', { ai_entity_id: aiId }, 'created_at'),
    ]);
    const conversations = conversationRows.map(fromCloudConversation);
    const conversationIds = new Map(conversationRows.map((row, index) => [row.id, conversations[index].id]));
    const messages = messageRows.map((row) => fromCloudMessage(row, conversationIds));
    const messageIds = new Map(messageRows.map((row, index) => [row.id, messages[index].id]));
    const facts = factRows.map((row) => fromCloudFact(row, messageIds));
    const factIds = new Map(factRows.map((row, index) => [row.id, facts[index].id]));
    const memories = memoryRows.map((row) => fromCloudMemory(row, messageIds, conversationIds));
    const memoryIds = new Map(memoryRows.map((row, index) => [row.id, memories[index].id]));
    return {
      found: true,
      profile: fromCloudProfile(profileRows[0]),
      settings: fromCloudSettings(settingsRows[0]),
      subscription: fromCloudSubscription(subscriptionRows[0]),
      ai: withGrowthKeys(fromCloudAI(aiRow), milestoneRows),
      conversations,
      messages,
      memories,
      facts,
      factConflicts: conflictRows.map((row) => fromCloudFactConflict(row, factIds, conversationIds)),
      skills: skillRows.map(fromCloudSkill),
      interests: interestRows.map(fromCloudInterest),
      milestones: milestoneRows.map(fromCloudMilestone),
      moodHistory: moodRows.map(fromCloudMood),
      relationshipEvents: relationshipRows.map(fromCloudRelationship),
      activities: activityRows.map(fromCloudActivity),
      letters: letterRows.map((row) => fromCloudLetter(row, memoryIds)),
      roomItems: roomRows.map(fromCloudRoomItem),
    };
  }

  async restoreLifeHistory(state) {
    const remote = await this.loadLifeHistory();
    if (!remote.found) return remote;
    if (state.ai?.cloudId && state.ai.cloudId !== remote.ai.cloudId) {
      throw new CloudError('This device contains a different Almost Human life. Export or reset the local copy before connecting this account.', 409, 'LIFE_CONFLICT');
    }
    if (state.ai && !state.ai.cloudId && state.ai.id !== remote.ai.id && ((state.messages?.length || 0) > 0 || (state.memories?.length || 0) > 1)) {
      throw new CloudError('This account already has an Almost Human life, while this device has a separate local life. Export one copy before choosing which life to keep.', 409, 'LIFE_CONFLICT');
    }
    state.profile = { ...state.profile, ...(remote.profile || {}), mode: 'cloud', cloudUserId: this.userId };
    const localSecurity = { appLockEnabled: state.settings.appLockEnabled, pinHash: state.settings.pinHash };
    state.settings = { ...state.settings, ...(remote.settings || {}), ...localSecurity, cloudSyncEnabled: true };
    if (remote.subscription) state.subscription = { ...state.subscription, ...remote.subscription };
    state.ai = preferNewer(state.ai, remote.ai);
    for (const key of ['conversations','messages','memories','facts','factConflicts','skills','interests','milestones','moodHistory','relationshipEvents','activities','letters','roomItems']) {
      state[key] = mergeRecordSets(state[key], remote[key]);
    }
    return { ...remote, restored: true };
  }

  async ensureCloudIdentity(state, force = false) {
    if (!this.authenticated || !state.ai) return null;
    if (state.ai.cloudId && !force) return { id: state.ai.cloudId };
    const entity = this.entity('AIEntity');
    let cloudAI = null;
    if (state.ai.cloudId) cloudAI = await entity.get(state.ai.cloudId).catch(() => null);
    if (!cloudAI && state.ai.id) cloudAI = (await entity.filter({ local_id: state.ai.id }, '-created_at', 1))[0] || null;
    const payload = {
      local_id: state.ai.id, name: state.ai.name, pronouns: state.ai.pronouns,
      birthday: state.ai.birthTimestamp || state.ai.birthday, simulated_age: state.ai.age,
      developmental_stage: state.ai.stageKey, appearance_seed: state.ai.appearanceSeed,
      voice_id: state.ai.voiceId, relationship_style: state.ai.relationshipStyle,
      current_mood: state.ai.currentMood, mood_intensity: state.ai.moodIntensity,
      personality_state: state.ai.personality, personality_history: state.ai.personalityHistory || [],
      development_state: { growthEventKeys: state.ai.growthEventKeys || [] },
      trust_score: state.ai.trust, attachment_score: state.ai.attachment, bond_score: state.ai.bond,
      room_state: { ...(state.ai.roomState || {}), appearanceProfile: state.ai.appearanceProfile || null }, favorite_things: state.ai.favoriteThings || {},
      last_interaction_at: state.ai.lastInteractionAt, last_growth_bucket: String(state.ai.lastGrowthBucket || ''),
      archived: Boolean(state.ai.archived), onboarding_complete: true
    };
    cloudAI = cloudAI ? await entity.update(cloudAI.id, payload) : await entity.create(payload);
    state.ai.cloudId = cloudAI.id;
    await this.syncProfileAndSettings(state).catch(() => {});
    return cloudAI;
  }

  async syncProfileAndSettings(state) {
    const user = await this.me();
    await this.entity('User').upsert({
      id: user.id, display_name: state.profile.displayName || '', timezone: state.settings.timezone || 'UTC',
      locale: state.settings.locale || 'en-US', country_code: state.settings.countryCode || 'US', onboarding_complete: Boolean(state.ai)
    }, 'id');
    await this.entity('AppSettings').upsert({
      user_id: user.id, days_per_year: state.settings.daysPerYear, voice_enabled: state.settings.voiceEnabled,
      voice_autoplay: state.settings.voiceAutoplay, voice_rate: state.settings.voiceRate,

      data_retention_days: state.settings.dataRetentionDays, sound_effects: state.settings.soundEffects,

  async ensureCloudConversation(state, localConversation, force = false) {
    if (!this.authenticated) return null;
    if (localConversation.cloudId && state.ai?.cloudId && !force) return { id: localConversation.cloudId };
    await this.ensureCloudIdentity(state, force);
    const entity = this.entity('Conversation');
    let cloud = localConversation.cloudId ? await entity.get(localConversation.cloudId).catch(() => null) : null;
    if (!cloud && localConversation.id) cloud = (await entity.filter({ local_id: localConversation.id }, '-created_at', 1))[0] || null;
    const payload = {
      ai_entity_id: state.ai.cloudId, local_id: localConversation.id, title: localConversation.title,
      status: localConversation.status || 'active', current_topic: localConversation.currentTopic,
      summary: localConversation.summary || '', message_count: localConversation.messageCount || 0,
      question_count: localConversation.questionCount || 0, last_message_at: localConversation.lastMessageAt
    };
    cloud = cloud ? await entity.update(cloud.id, payload) : await entity.create(payload);
    localConversation.cloudId = cloud.id;
    return cloud;
  }

  async syncLifeHistory(state) {
    if (!this.authenticated || !state.ai) return { synced: 0, conversations: 0, messages: 0 };
    await this.ensureCloudIdentity(state, true);
    let synced = 0;
    let conversationCount = 0;
    let messageCount = 0;
    const conversationMap = new Map();
    for (const conversation of (state.conversations || []).slice(0, 500)) {
      const cloudConversation = await this.ensureCloudConversation(state, conversation, true);
      conversationMap.set(conversation.id, cloudConversation.id);
      conversationCount += 1;
    }
    const messages = this.entity('Message');
    for (const row of (state.messages || []).slice(-5000)) {
      const conversationId = conversationMap.get(row.conversationId);
      if (!conversationId) continue;
      const cloudMessage = await messages.upsert({
        ai_entity_id: state.ai.cloudId, conversation_id: conversationId, local_id: row.id,
        sender: row.sender, content: String(row.content || '').slice(0, 20000), emotion: row.emotion,
        intent: row.intent, age_at_message: row.ageAtMessage, developmental_stage: row.stageKey,
        repetition_score: Number(row.repetitionScore || 0), repetition_reason: row.repetitionReason,
        request_id: row.requestId, status: row.status || 'complete', client_created_at: row.createdAt,
        safety_flags: row.safetyFlags || [], model_used: row.providerMode || 'local', metadata: { provider_mode: row.providerMode || 'local' }
      });
      row.cloudId = cloudMessage?.id || row.cloudId || null;
      messageCount += 1;
    }
    const specs = [
      ['Memory', state.memories, mapMemory], ['UserFact', state.facts, mapFact], ['FactConflict', state.factConflicts, mapFactConflict],
      ['Skill', state.skills, mapSkill], ['Interest', state.interests, mapInterest], ['Milestone', state.milestones, mapMilestone],
      ['MoodHistory', state.moodHistory, mapMood], ['RelationshipEvent', state.relationshipEvents, mapRelationship],
      ['Activity', state.activities, mapActivity], ['Letter', state.letters, mapLetter], ['RoomItem', state.roomItems, mapRoomItem]
    ];
    for (const [name, rows, mapper] of specs) {
      const entity = this.entity(name);
      for (const row of (rows || []).slice(0, 5000)) {
        const cloudRow = await entity.upsert({ ai_entity_id: state.ai.cloudId, local_id: row.id, ...mapper(row, state, conversationMap) });
        row.cloudId = cloudRow?.id || row.cloudId || null;
        synced += 1;
      }
    }
    await this.syncProfileAndSettings(state);
    return { synced, conversations: conversationCount, messages: messageCount };
  }

  async chatStreamProvider({ state, conversation, text, requestId, opening = false, localUserMessageId = null, localAiMessageId = null }, onEvent, signal) {
    if (!this.authenticated) throw new CloudError('Sign in to use secure cloud intelligence.', 401, 'AUTH_REQUIRED');
    await this.ensureCloudIdentity(state);
    const cloudConversation = await this.ensureCloudConversation(state, conversation);
    await this.ensureFreshSession();
    const deployedName = this.config.functionNames?.chatStream || 'chat-stream';
    const controller = new AbortController();
    const abort = () => controller.abort(signal?.reason || 'cancelled');
    if (signal?.aborted) abort(); else signal?.addEventListener('abort', abort, { once: true });
    const timeout = setTimeout(() => controller.abort('timeout'), 20_000);
    let final = null;
    try {
      const response = await fetch(`${this.config.url}/functions/v1/${encodeURIComponent(deployedName)}`, {
        method: 'POST',
        headers: { ...this.baseHeaders({ authenticated: true }), Accept: 'text/event-stream', 'x-request-id': requestId },
        body: JSON.stringify({
          ai_entity_id: state.ai.cloudId, conversation_id: cloudConversation.id, user_message: text,
          request_id: requestId, opening: Boolean(opening), local_user_message_id: localUserMessageId,
          local_ai_message_id: localAiMessageId,
        }),
        signal: controller.signal,
      });
      if (!response.ok || !response.body) {
        const raw = await response.text();
        let detail = null; try { detail = raw ? JSON.parse(raw) : null; } catch { detail = raw; }
        throw new CloudError(detail?.error || `Streaming reply failed (${response.status}).`, response.status, detail?.code, detail);
      }
      await parseEventStream(response.body, async (event) => {
        if (event.type === 'done') final = event.data;
        if (event.type === 'error' && !event.data?.cancelled) throw new CloudError(event.data?.message || 'Streaming reply failed.', 502, event.data?.code || 'STREAM_ERROR', event.data);
        await onEvent?.(event);
      }, controller.signal);
      return final;
    } catch (error) {
      if (controller.signal.aborted && signal?.aborted) throw new CloudError('Reply cancelled.', 499, 'CANCELLED');
      if (controller.signal.aborted) throw new CloudError('The live reply timed out.', 408, 'STREAM_TIMEOUT');
      throw error;
    } finally {
      clearTimeout(timeout);
      signal?.removeEventListener('abort', abort);
    }
  }

  async chatProvider({ state, conversation, text, requestId, localUserMessageId = null, localAiMessageId = null }) {
    if (!this.authenticated) throw new CloudError('Sign in to use secure cloud intelligence.', 401, 'AUTH_REQUIRED');
    await this.ensureCloudIdentity(state);
    const cloudConversation = await this.ensureCloudConversation(state, conversation);
    let result = null;
    const deadline = Date.now() + 18_000;
    for (let attempt = 0; attempt < 12 && Date.now() < deadline; attempt += 1) {
      result = await this.invoke('chatService', {
        ai_entity_id: state.ai.cloudId, conversation_id: cloudConversation.id,
        user_message: text, request_id: requestId,
        local_user_message_id: localUserMessageId, local_ai_message_id: localAiMessageId
      }, { timeoutMs: Math.max(3000, Math.min(12_000, deadline - Date.now())) });
      if (!result?.pending) break;
      await sleep(Math.min(1100, 350 + attempt * 70));
    }
    if (result?.pending || !result?.ai_text) throw new CloudError('The secure reply is still processing. Try sending again; the request will not duplicate.', 408, 'REQUEST_PENDING');
    return { text: result.ai_text, mode: result.provider_mode || 'cloud-ai', cloudMessageId: result.message_id, cloudUserMessageId: result.user_message_id || null };
  }

  async activityProvider({ state, type, input, requestId, localActivityId = null }) {
    if (!this.authenticated) throw new CloudError('Sign in to use secure cloud activities.', 401, 'AUTH_REQUIRED');
    await this.ensureCloudIdentity(state);
    let result = null;
    for (let attempt = 0; attempt < 32; attempt += 1) {
      result = await this.invoke('activityService', {
        ai_entity_id: state.ai.cloudId, activity_type: type, user_input: String(input || ''), request_id: requestId,
        local_activity_id: localActivityId
      }, { timeoutMs: 32000 });
      if (!result?.pending) return result;
      await sleep(Math.min(1500, 450 + attempt * 75));
    }
    throw new CloudError('The secure activity is still processing. Retry it; the request will not duplicate.', 408, 'REQUEST_PENDING');
  }

  async voiceProvider({ state, text, voiceId = null, requestId = null, signal = null }) {

    }, { raw: true, timeoutMs: 30000, signal });

class CloudError extends Error {

function normalizeSession(data) {
  const expiresIn = Number(data?.expires_in || 3600);
  return {
    ...data,
    expires_at: Number(data?.expires_at || Math.floor(Date.now() / 1000) + expiresIn),
    user: data?.user || jwtUser(data?.access_token)
  };
}
function jwtPayload(token) { try { return JSON.parse(atob(String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return null; } }

function camelToKebab(value) { return String(value).replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase(); }
function mapField(key) { return FIELD_ALIASES[key] || key; }

function normalizeOutbound(value) {
  const output = {};
  for (const [key, item] of Object.entries(value || {})) {
    const mapped = mapField(key);
    if (['id','created_at','updated_at'].includes(mapped) && item == null) continue;
    if (item !== undefined) output[mapped] = item;
  }
  return output;
}
function normalizeInbound(row) {
  if (!row || typeof row !== 'object') return row;
  return { ...row, created_date: row.created_at, updated_date: row.updated_at, created_by_id: row.user_id };
}
function readJson(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } }
function writeJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function removeStorage(key) { try { localStorage.removeItem(key); } catch {} }
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

function mapMemory(row, state, conversationMap) { return { memory_type: row.type || 'episodic', title: row.title, content: row.content, normalized_content: row.normalizedContent, importance_score: row.importance, confidence_score: row.confidence, emotional_tone: row.emotionalTone, emotional_intensity: row.emotionalIntensity, source_message_id: state?.messages?.find(item=>item.id===row.sourceMessageId)?.cloudId || null, source_conversation_id: conversationMap?.get(row.sourceConversationId) || null, age_created: row.ageCreated, is_core_memory: Boolean(row.isCore), is_private: Boolean(row.isPrivate), tags: row.tags || [], recall_count: row.recallCount || 0, last_recalled_at: row.lastRecalledAt, status: row.status || 'active' }; }
function mapFact(row, state) { return { category: row.category, fact_key: row.label || row.key || row.factKey, normalized_key: row.key || row.normalizedKey || normalizeKey(row.label), fact_value: row.value || row.factValue, confidence: row.confidence, user_verified: Boolean(row.verified), source_message_id: state?.messages?.find(item=>item.id===row.sourceMessageId)?.cloudId || null, status: row.status || 'active' }; }
function mapFactConflict(row, state, conversationMap) { return { fact_key: row.factKey || row.key, existing_fact_id: state?.facts?.find(item=>item.id===row.factId)?.cloudId || null, existing_value: row.existingValue, proposed_value: row.proposedValue, confidence: row.confidence, source_conversation_id: conversationMap?.get(row.sourceConversationId) || null, status: row.status || 'pending', resolved_at: row.resolvedAt }; }
function mapSkill(row) { return { skill_name: row.name || row.skillName, skill_category: row.category, proficiency: row.proficiency || 0, xp: row.xp || 0, level: row.level || 1, evidence_count: row.evidenceCount || 0, unlocked_at: row.unlockedAt, last_practiced_at: row.lastPracticedAt }; }
function mapInterest(row) { return { interest_name: row.name || row.interestName, affinity_score: row.affinity || row.affinityScore || 0, source: row.source, evidence_count: row.evidenceCount || 0, first_observed_at: row.createdAt, last_observed_at: row.updatedAt || row.createdAt }; }
function mapMilestone(row) { return { milestone_type: row.type || row.milestoneType, title: row.title, description: row.description || '', age_reached: row.age, media_url: row.mediaUrl, is_keepsake: Boolean(row.isKeepsake), event_key: row.eventKey, metadata: row.metadata || {} }; }
function mapMood(row) { return { mood: row.mood, intensity: Math.min(1, Number(row.intensity || 50) / (Number(row.intensity || 0) > 1 ? 100 : 1)), cause: row.cause }; }
function mapRelationship(row) { return { event_type: row.type || row.eventType, impact: row.impact || 'neutral', description: row.description, resolved: Boolean(row.resolved) }; }

  return `<article class="message ${user ? 'user' : 'ai'} ${pending ? 'streaming' : ''} ${failed ? 'failed' : ''}"><div class="${user ? 'user-spacer' : 'message-mark'}">${user ? '' : beingMarkup({ seed: state.ai.appearanceSeed, mood: message.emotion, stageKey: message.stageKey, tiny: true, appearance: state.ai.appearanceProfile })}</div><div class="message-body"><div class="bubble">${content}</div><div class="message-foot"><span>${relativeDate(message.createdAt)}</span>${user || pending ? '' : `<button data-action="speak-message" data-id="${message.id}">▶ Hear</button><button data-action="remember-message" data-id="${message.id}">◇ Keep</button>`}${failed ? `<button data-action="retry-message" data-id="${message.id}">Retry</button>` : ''}</div></div></article>`;
}

  const raw = String(value || 'female-adult');

function normalizeAppearance(value) {
  const input = value && typeof value === 'object' ? value : {};
  return {
    skinTone: APPEARANCE_OPTIONS.skinTone.some(([key]) => key === input.skinTone) ? input.skinTone : 'warm',
    hairStyle: APPEARANCE_OPTIONS.hairStyle.some(([key]) => key === input.hairStyle) ? input.hairStyle : 'waves',

}

function sameAppearance(left, right) {
  return ['skinTone','hairStyle','hairColor','eyeColor'].every((key) => left?.[key] === right?.[key]);

async function handleSubmit(event) {
  event.preventDefault();
  const form = event.target;
  try {
    if (form.id === 'onboard-quick-create') {
      const data = new FormData(form);
      const name = String(data.get('name') || '').trim();
      if (!name) throw new Error('Give them a name first.');
      ui.onboarding.caregiverName = String(data.get('caregiverName') || '').trim();
      ui.onboarding.name = name;
      ui.onboarding.pronouns = String(data.get('pronouns') || 'they/them');
      return awaken();
    }
    if (form.id === 'onboard-identity') {
      const data = new FormData(form);
      const name = String(data.get('name') || '').trim();
      if (!name) throw new Error('Give them a name first.');
      ui.onboarding.caregiverName = String(data.get('caregiverName') || '').trim();
      ui.onboarding.name = name;
      ui.onboarding.pronouns = String(data.get('pronouns') || 'they/them');
      ui.onboardingStep = 1;
      return render();
    }
    if (form.id === 'chat-form') {
      const input = form.elements.message;
      const value = String(input.value || '').trim();
      if (!value) return;
      input.value = '';
      ui.chatDraft = '';
      return sendChat(value, false);
    }
    if (form.id === 'activity-form') {
      const data = new FormData(form);
      return runActivity(form.dataset.type, String(data.get('input') || ''));
    }
    if (form.id === 'modal-form') {
      return ui.modal?.onSubmit?.(new FormData(form));
    }
  } catch (error) { reportError(error); }
}

async function handleNativeEvent(event) {
  const detail = event?.detail || {};
  if (detail.type === 'daily-moment') {
    if (detail.permission === false) {
      updateSetting('notificationsEnabled', false).catch(() => {});
      toast('Notifications stayed off', 'Your device did not grant permission.');
      return;
    }
    if (detail.enabled) toast('Gentle reminder ready', 'One quiet local moment at 7 PM.');
    return;
  }
  if (detail.type === 'audio-state') {
    const id = String(detail.id || '');
    const waiter = nativeAudioWaiters.get(id);
    if (waiter) {
      nativeAudioWaiters.delete(id);
      waiter.cleanup?.();
      if (detail.state === 'error') waiter.reject(new Error(String(detail.error || 'Native audio failed.')));
      else if (detail.state === 'ended' || detail.state === 'stopped') waiter.resolve({ interrupted: Boolean(detail.interrupted) });
    }
    if (detail.state === 'playing') {
      ui.activeRequestState = 'speaking';
      scheduleRender();
    }
    return;
  }
  if (detail.type === 'app-state' && detail.state !== 'active') {
    phraseQueue.stop();
    stopVoice();
    return;
  }
  if (detail.type === 'mic-state') {
    ui.listening = Boolean(detail.recording);
    ui.transcribing = Boolean(detail.transcribing);
    render();
    if (detail.permission === false) toast('Microphone access is off', detail.canAskAgain === false ? 'Open iPhone Settings → Almost Human → Microphone and turn it on.' : 'Tap the mic again and choose Allow.');
    if (detail.error) toast('Microphone did not finish', String(detail.error));
    return;
  }
  if (detail.type === 'mic-audio') {
    ui.listening = false;
    ui.transcribing = true;
    render();
    try {
      const result = await cloud.transcribeAudio({ audioBase64: detail.audioBase64, mimeType: detail.mimeType, language: state.settings.locale || 'en-US' });
      const transcript = String(result?.text || '').trim();
      if (!transcript) throw new Error('No words were detected.');
      ui.transcribing = false;
      render();
      await sendChat(transcript, false);
    } catch (error) {
      ui.transcribing = false;
      render();
      reportError(error, 'microphone_transcription');
    }
  }
}

function handleChange(event) {
  if (event.target.matches('[data-onboard-safety]')) {
    ui.onboarding.acceptedSafety = event.target.checked;
    return render();
  }
  if (event.target.matches('[data-setting-range]')) {

    return updateSetting(event.target.dataset.settingRange, value);

async function startGuest() {
  if (ui.authBusy) return;
  ui.authBusy = true;
  render();
  try {
    const session = await Promise.race([
      cloud.loginAnonymously({ source: 'almost_human_guest', created_at: new Date().toISOString() }),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Guest sign-in timed out. Please try again.')), 12000)),
    ]);
    ui.privateMode = false;
    sessionStorage.removeItem('almost_human_private_mode');
    await store.update((draft) => {
      draft.profile.mode = 'cloud';
      draft.profile.cloudUserId = session.user?.id || cloud.userId;
      draft.profile.email = session.user?.email || '';
      draft.settings.cloudSyncEnabled = true;
    });
    state = store.snapshot();
    ui.selectedConversationId = activeConversation()?.id || null;
    toast('Private guest created', 'Your companion can be protected with an email later.');
    queueMicrotask(() => connectCloudSession(session.user || {}).catch((error) => recordError('guest_restore', error)));
  } catch (error) {
    reportError(error, 'guest_signin');
  } finally {
    ui.authBusy = false;
    render();
  }
}

async function startOAuth(provider) {
  try {
    const settings = await cloud.authSettings();

      toast(`${capitalize(provider)} sign-in is not enabled yet`, 'Guest and email access still work. Add this provider in Supabase Auth when you are ready.');
      return;

function choosePrivateMode() {

function returnToGate() {
  ui.privateMode = false;

function nextOnboarding() {

async function awaken() {
  if (!ui.onboarding.acceptedSafety) return toast('Safety acknowledgment needed', 'Confirm that this is an AI experience.');
  await store.update((draft) => {
    new AlmostHumanEngine(draft).awaken(ui.onboarding);
    draft.settings.voiceEnabled = true;
    draft.settings.voiceAutoplay = true;
    draft.settings.cloudSyncEnabled = cloud.authenticated;
    draft.profile.mode = cloud.authenticated ? 'cloud' : 'local';
    draft.profile.cloudUserId = cloud.userId;
  });
  state = store.snapshot();
  ui.selectedConversationId = state.conversations[0]?.id || null;
  ui.birthActive = true;
  ui.birthPhase = 0;
  ui.birthOpeningStarted = false;
  render();
  beginBirthSequence();
}

function beginBirthSequence() {
  clearInterval(birthTimer);
  const started = Date.now();
  const duration = firstLightDurationMs();
  const syncPromise = cloud.authenticated ? store.update(async (draft) => {
    await cloud.ensureCloudIdentity(draft, true);
    await cloud.ensureCloudConversation(draft, draft.conversations[0], true);
    await cloud.syncProfileAndSettings(draft);
  }).catch((error) => recordError('first_light_cloud', error)) : Promise.resolve();
  birthTimer = setInterval(() => {
    const elapsed = Date.now() - started;
    ui.birthPhase = Math.min(2, Math.floor(elapsed / Math.max(1, duration / 3)));
    render();
    if (elapsed >= duration) {
      clearInterval(birthTimer);
      syncPromise.finally(() => finishBirth());
    }
  }, 120);
}

function finishBirth() {
  clearInterval(birthTimer);
  const needsOpening = !state.messages.some((item) => item.sender === 'ai');
  ui.birthActive = false;
  location.hash = 'talk';
  render();
  if (needsOpening) queueMicrotask(() => sendChat('', true).catch(() => {}));
}

async function sendChat(value, opening = false, { quiet = false } = {}) {
  const text = String(value || '').trim();
  if (!text && !opening) return;
  stopCurrentTurn('superseded');
  stopVoice();
  const requestId = makeRequestId('chat');
  const timing = new ConversationTimings(requestId);
  activeChatTiming = timing;
  let turn = null;
  let conversationId = ui.selectedConversationId || state.conversations[0]?.id;
  let streamed = false;
  try {
    if (state.settings.cloudSyncEnabled && cloud.authenticated) {
      await store.update((draft) => {
        const localEngine = new AlmostHumanEngine(draft);
        localEngine.reconcileGrowth();
        let conversation = conversationId ? draft.conversations.find((item) => item.id === conversationId) : null;
        if (!conversation) conversation = localEngine.createConversation(opening ? 'The first hello' : 'A new beginning');
        conversationId = conversation.id;
        ui.selectedConversationId = conversationId;
        turn = createOptimisticTurn(draft, { requestId, conversationId, text, age: draft.ai.age, stageKey: getStage(draft.ai.age).key });
        if (text && !turn.reused) {
          conversation.messageCount = Number(conversation.messageCount || 0) + 1;
          conversation.lastMessageAt = new Date().toISOString();
          conversation.currentTopic = text.split(/\s+/).slice(0, 5).join(' ');
        }
      });
      ui.activeRequestId = requestId;
      ui.activeRequestState = 'connecting';
      activeChatController = new AbortController();
      if (!quiet) render();
      await store.update(async (draft) => {
        const conversation = draft.conversations.find((item) => item.id === conversationId);
        await cloud.ensureCloudIdentity(draft);
        await cloud.ensureCloudConversation(draft, conversation);
      });
      const snapshot = store.snapshot();
      const conversation = snapshot.conversations.find((item) => item.id === conversationId);
      let cursor = 0;
      const final = await cloud.chatStreamProvider({ state: snapshot, conversation, text, requestId, opening, localUserMessageId: turn.userMessageId, localAiMessageId: turn.aiMessageId }, async (event) => {
        await store.update((draft) => {
          const message = applyStreamEvent(draft, turn, event);
          const conversationDraft = draft.conversations.find((item) => item.id === conversationId);
          if (event.type === 'delta') { timing.markFirstDelta(); ui.activeRequestState = 'receiving'; }
          if (event.type === 'metadata') timing.providerMode = event.data.providerMode || timing.providerMode;
          if (event.type === 'done' && conversationDraft) {
            timing.markDone();
            conversationDraft.messageCount = Number(conversationDraft.messageCount || 0) + 1;
            conversationDraft.lastMessageAt = new Date().toISOString();
            conversationDraft.updatedAt = new Date().toISOString();
            if (/^(A new beginning|The first hello)$/.test(conversationDraft.title || '')) conversationDraft.title = (text || message?.content || 'First hello').split(/\s+/).slice(0, 6).join(' ');
            draft.ai.lastInteractionAt = new Date().toISOString();
            appendTimingSample(draft.diagnostics, timing.toSample());
          }
        });
        streamed = streamed || event.type === 'delta';
        const message = state.messages.find((item) => item.id === turn.aiMessageId);
        if (message && state.settings.voiceAutoplay && state.settings.voiceEnabled) {
          const segmented = segmentSpeakablePhrases(message.content, cursor, event.type === 'done');
          cursor = segmented.cursor;
          segmented.phrases.forEach((phrase, index) => phraseQueue.enqueue({ id: `${requestId}-${cursor}-${index}`, text: phrase, voiceId: normalizeVoiceId(state.ai.voiceId) }));
        }
        scrollMessages();
      }, activeChatController.signal);
      if (!final?.text && !streamed) throw new Error('The reply stream ended before text arrived.');
      queueCloudSync(1200);
    } else {
      let result;
      await store.update(async (draft) => {
        const localEngine = new AlmostHumanEngine(draft);
        result = await localEngine.sendMessage(text, { conversationId, requestId, opening });
        ui.selectedConversationId = result.conversation.id;
      });
      timing.markFirstDelta(); timing.markDone();
      if (state.settings.voiceAutoplay && state.settings.voiceEnabled && result?.aiMessage) void speak(result.aiMessage.content);
    }
  } catch (error) {
    if (activeChatController?.signal.aborted) {
      if (turn) await store.update((draft) => applyStreamEvent(draft, turn, { type: 'error', data: { code: 'CANCELLED', cancelled: true } }));
    } else if (turn) {
      try {
        const snapshot = store.snapshot();
        const conversation = snapshot.conversations.find((item) => item.id === conversationId);
        const fallback = await cloud.chatProvider({ state: snapshot, conversation, text, requestId, localUserMessageId: turn.userMessageId, localAiMessageId: turn.aiMessageId });
        await store.update((draft) => applyStreamEvent(draft, turn, { type: 'done', data: { text: fallback.text, messageId: fallback.cloudMessageId, userMessageId: fallback.cloudUserMessageId, providerMode: 'cloud-nonstream-fallback' } }));
        toast('Live text was unavailable', 'The reply completed without streaming.');
      } catch (fallbackError) {
        await store.update((draft) => applyStreamEvent(draft, turn, { type: 'error', data: { code: 'REPLY_FAILED' } }));
        reportError(fallbackError, 'chat');
      }
    } else reportError(error, 'chat');
  } finally {
    if (ui.activeRequestId === requestId) {
      ui.activeRequestId = null;
      ui.activeRequestState = null;
      activeChatController = null;
      activeChatTiming = null;
      render();
      scrollMessages();
    }
  }
}

async function playBlob(blob, signal) {
  stopVoice();
  if (window.__AH_NATIVE_BUNDLE__) {
    const id = makeRequestId('native_audio');
    const base64 = await blobToBase64(blob);
    return new Promise((resolve, reject) => {
      const abort = () => nativePost('audio-stop');
      const cleanup = () => signal?.removeEventListener('abort', abort);
      nativeAudioWaiters.set(id, { resolve, reject, cleanup });
      signal?.addEventListener('abort', abort, { once: true });
      nativePost('audio-play', { id, base64, mimeType: blob.type || 'audio/mpeg' });
    });
  }
  activeAudioUrl = URL.createObjectURL(blob);
  activeAudio = new Audio(activeAudioUrl);
  let settleInterrupted = null;
  const complete = new Promise((resolve, reject) => {
    settleInterrupted = () => resolve({ interrupted: true });
    activeAudio.onended = () => { stopVoice(); resolve({ interrupted: false }); };
    activeAudio.onerror = () => { stopVoice(); reject(new Error('Audio playback failed.')); };
  });
  const abort = () => {
    stopVoice();
    settleInterrupted?.();
  };
  signal?.addEventListener('abort', abort, { once: true });
  try { await activeAudio.play(); return await complete; }
  finally { signal?.removeEventListener('abort', abort); }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('Audio could not be prepared.'));
    reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
    reader.readAsDataURL(blob);
  });
}

function stopVoice() {
  if (window.__AH_NATIVE_BUNDLE__) nativePost('audio-stop');
  for (const [id, waiter] of nativeAudioWaiters) {
    nativeAudioWaiters.delete(id);
    waiter.cleanup?.();
    waiter.resolve({ interrupted: true });
  }
  if (activeAudio) { activeAudio.pause(); activeAudio.src = ''; activeAudio = null; }
  if (activeAudioUrl) { URL.revokeObjectURL(activeAudioUrl); activeAudioUrl = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function speakLocally(text, rawVoiceId) {
  if (window.__AH_NATIVE_BUNDLE__) {
    nativePost('device-speak-once', { text: String(text || ''), voiceId: normalizeVoiceId(rawVoiceId) });
    return;
  }
  if (!('speechSynthesis' in window)) return;
  const voiceId = normalizeVoiceId(rawVoiceId);
  const profile = VOICE_PROFILES[voiceId] || VOICE_PROFILES['female-adult'];
  const utterance = new SpeechSynthesisUtterance(String(text));
  const voices = speechSynthesis.getVoices();
  const preferred = voices.find((voice) => /en/i.test(voice.lang) && /natural|aria|jenny|guy|samantha|ava|daniel|alex/i.test(voice.name)) || voices.find((voice) => /en/i.test(voice.lang)) || voices[0];
  if (preferred) utterance.voice = preferred;
  utterance.rate = profile.rate;
  utterance.pitch = profile.pitch;
  speechSynthesis.speak(utterance);
}

function startListening() {
  phraseQueue.stop();
  stopVoice();
  if (window.__AH_NATIVE_BUNDLE__) {
    if (!cloud.authenticated) return toast('Voice input needs a private guest or account', 'Connect once so speech can be transcribed securely.');
    nativePost('mic-toggle');
    return;
  }
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) return toast('Speech input is unavailable', 'Type your message instead.');
  const recognition = new Recognition();
  recognition.lang = state.settings.locale || 'en-US';
  recognition.interimResults = false;
  recognition.onresult = (event) => {
    const transcript = String(event.results?.[0]?.[0]?.transcript || '').trim();
    if (transcript) sendChat(transcript, false);
  };
  recognition.onerror = () => toast('I could not hear that', 'Check microphone permission and try again.');
  recognition.start();
}

function nativePost(type, payload = {}) {

function tactileFeedback(target) {

function localDayKey(value = Date.now()) {

}

function todaysCheckin() {
  const today = localDayKey();
  const event = (state.relationshipEvents || []).find((item) => item.type === 'daily_checkin' && localDayKey(item.createdAt) === today);
  if (!event) return null;
  return { ...event, mood: event.mood || String(event.description || '').replace(/^User check-in:\s*/i, '').trim().toLowerCase() };
}

async function recordDailyCheckin(mood) {
  const cleanMood = ['steady','bright','heavy','restless','hopeful'].includes(mood) ? mood : 'steady';
  const today = localDayKey();
  await store.update((draft) => {
    draft.relationshipEvents ||= [];
    const existing = draft.relationshipEvents.find((item) => item.type === 'daily_checkin' && localDayKey(item.createdAt) === today);
    const payload = { mood: cleanMood, impact: 'neutral', description: `User check-in: ${cleanMood}`, resolved: true, updatedAt: new Date().toISOString() };
