name: Almost Human Build 5 Version 10 No-Credit Certification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: almost-human-build-5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:all

  mobile-no-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run validate

  forbidden-release-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove Build 5 certification cannot spend or submit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='build-5-version-10-ci.yml' -E 'eas[[:space:]]+(build|submit)|altool|notarytool' .github/workflows
          ! grep -R --line-number -E 'BUILD_ONCE|SUBMIT_EXISTING' BUILD5_ROLLBACK_BASELINE.md
          echo 'Build 5 certification contains no EAS build, submit, TestFlight, or App Store command.'
